<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messho SC TL Dashboard</title>
<style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}header{background:#172033;color:white;padding:18px}main{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0}input,button{padding:11px;margin:5px;border-radius:9px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#eef4ff;border-radius:12px}.stat b{display:block;font-size:24px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><header><h1>Messho SC — TL Dashboard</h1></header><main>
<div id="login" class="card"><h2>Admin Login</h2><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="m"></p></div>
<div id="app" style="display:none"><div class="card"><div class="grid"><div class="stat"><b id="p">0</b>Present</div><div class="stat"><b id="a">0</b>Absent</div><div class="stat"><b id="l">0</b>Late</div><div class="stat"><b id="w">0</b>Week-off</div></div></div>
<div class="card"><input id="date" type="date"><button onclick="load()">Refresh</button><button onclick="csv()">Download CSV</button></div>
<div class="card scroll"><table><thead><tr><th>Employee</th><th>Name</th><th>Week-off</th><th>In</th><th>Out</th><th>Status</th><th>GPS</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://iijuflktxqqtgjbdywwj.supabase.co','sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0');
document.getElementById('date').value=new Date().toISOString().slice(0,10);
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return m.textContent=error.message;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}
async function load(){const d=document.getElementById('date').value;const {data:es}=await sb.from('employees').select('*').order('employee_id');const {data:as}=await sb.from('attendance').select('*').eq('attendance_date',d);let p=0,a=0,l=0,w=0;rows.innerHTML=(es||[]).map(e=>{const r=(as||[]).find(x=>x.employee_id===e.id),day=new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'}),s=r?.status||(e.week_off===day?'Week-off':'Absent');if(s==='Present')p++;if(s==='Absent')a++;if(s==='Late')l++;if(s==='Week-off')w++;return `<tr><td>${e.employee_id}</td><td>${e.name}</td><td>${e.week_off}</td><td>${r?.check_in||'-'}</td><td>${r?.check_out||'-'}</td><td>${s}</td><td>${r?.check_in_lat?r.check_in_lat+', '+r.check_in_lng:'-'}</td></tr>`}).join('');pEl.textContent=p;aEl.textContent=a;lEl.textContent=l;wEl.textContent=w}
async function csv(){const {data}=await sb.from('attendance').select('attendance_date,employee_id,check_in,check_out,status,check_in_lat,check_in_lng,check_out_lat,check_out_lng').order('attendance_date');let t='Date,Employee ID,Check In,Check Out,Status,In Lat,In Lng,Out Lat,Out Lng\n'+(data||[]).map(r=>Object.values(r).map(v=>`"${v??''}"`).join(',')).join('\n');let u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='messho-sc-attendance.csv';x.click();URL.revokeObjectURL(u)}
const pEl=document.getElementById('p'),aEl=document.getElementById('a'),lEl=document.getElementById('l'),wEl=document.getElementById('w'),m=document.getElementById('m');
window.login=login;window.load=load;window.csv=csv;
</script></body></html>
