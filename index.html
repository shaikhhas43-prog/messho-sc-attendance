</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://iijuflktxqqtgjbdywwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   OFFICE GPS
========================================= */

const OFFICE_LAT = 19.307765;
const OFFICE_LNG = 73.071277;

const OFFICE_RADIUS_METERS = 150;


/* =========================================
   COMPANY HOLIDAYS
========================================= */

const COMPANY_HOLIDAYS = [

  // Example:
  // "2026-08-15"

];


/* =========================================
   ELEMENTS
========================================= */

const msg =
document.getElementById("msg");

const checkInButton =
document.getElementById("checkIn");

const checkOutButton =
document.getElementById("checkOut");

const myAttendanceButton =
document.getElementById("myAttendance");

const reportCard =
document.getElementById("reportCard");

const employeeName =
document.getElementById("employeeName");

const reportMsg =
document.getElementById("reportMsg");

const reportTable =
document.getElementById("reportTable");

const reportBody =
reportTable.querySelector("tbody");


function message(text){

  msg.textContent = text;

}


/* =========================================
   INDIA DATE / TIME
========================================= */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",

        year:"numeric",
        month:"2-digit",
        day:"2-digit",

        hour:"2-digit",
        minute:"2-digit",

        hour12:false,

        weekday:"long"
      }
    ).formatToParts(new Date());


  const get =
    type =>
      parts.find(
        p => p.type === type
      )?.value;


  return {

    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")

  };

}


/* =========================================
   GPS DISTANCE
========================================= */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRadians =
    value =>
      value * Math.PI / 180;


  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);


  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(
      toRadians(lat1)
    ) *

    Math.cos(
      toRadians(lat2)
    ) *

    Math.sin(dLon / 2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* =========================================
   GPS
========================================= */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "This browser does not support GPS."
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          const distance =
            distanceInMeters(
              lat,
              lng,
              OFFICE_LAT,
              OFFICE_LNG
            );


          if(
            distance >
            OFFICE_RADIUS_METERS
          ){

            reject(
              new Error(
                "Attendance blocked ❌\n" +
                "You are outside the office area.\n" +
                "Distance: " +
                Math.round(distance) +
                " meters"
              )
            );

            return;

          }


          resolve({

            latitude:lat,

            longitude:lng,

            accuracy:accuracy,

            distance:
              Math.round(distance)

          });

        },


        error => {

          let text =
            "GPS location nahi mil rahi.";


          if(error.code === 1){

            text =
              "GPS permission Allow karo, phir dobara try karo.";

          }


          else if(error.code === 2){

            text =
              "GPS location unavailable. Location ON karo.";

          }


          else if(error.code === 3){

            text =
              "GPS timeout. Dobara try karo.";

          }


          reject(
            new Error(text)
          );

        },


        {

          enableHighAccuracy:true,

          timeout:15000,

          maximumAge:0

        }

      );

    }
  );

}


/* =========================================
   HOLIDAY
========================================= */

function isHoliday(date){

  return COMPANY_HOLIDAYS.includes(date);

}


/* =========================================
   WEEK OFF
========================================= */

function isWeeklyOff(
  employee,
  weekday
){

  if(!employee.week_off)
    return false;


  return (

    String(
      employee.week_off
    )
    .trim()
    .toLowerCase()

  ===

    weekday
    .toLowerCase()

  );

}


/* =========================================
   VERIFY EMPLOYEE
========================================= */

async function verifyEmployee(){

  const id =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(!id || !pin){

    message(
      "Employee ID aur PIN bharo."
    );

    return null;

  }


  const {

    data:emp,

    error

  } =

    await db

      .from("employees")

      .select(
        "id,employee_id,name,pin,week_off,active"
      )

      .eq(
        "employee_id",
        id
      )

      .eq(
        "pin",
        pin
      )

      .eq(
        "active",
        true
      )

      .maybeSingle();


  if(error){

    message(
      "Database error: " +
      error.message
    );

    return null;

  }


  if(!emp){

    message(
      "Employee ID/PIN incorrect."
    );

    return null;

  }


  return emp;

}


/* =========================================
   CHECK IN / CHECK OUT
========================================= */

async function mark(type){

  checkInButton.disabled = true;

  checkOutButton.disabled = true;

  myAttendanceButton.disabled = true;


  try{

    message(
      "Employee verify ho raha hai..."
    );


    const emp =
      await verifyEmployee();


    if(!emp)
      return;


    const now =
      getIndiaDateTime();


    if(
      isHoliday(
        now.date
      )
    ){

      message(
        "Aaj company holiday hai. 🛑\n" +
        "Attendance allowed nahi hai."
      );

      return;

    }


    if(
      isWeeklyOff(
        emp,
        now.weekday
      )
    ){

      message(
        "Aaj aapka weekly off hai. 🛑\n" +
        "Attendance allowed nahi hai."
      );

      return;

    }


    message(
      "GPS location verify ho rahi hai..."
    );


    const gps =
      await getGPS();


    /* =====================================
       CHECK IN
    ===================================== */

    if(type === "in"){

      const {

        data:existing,

        error:findError

      } =

        await db

          .from("attendance")

          .select(
            "id,check_in,check_out"
          )

          .eq(
            "employee_id",
            emp.id
          )

          .eq(
            "attendance_date",
            now.date
          )

          .maybeSingle();


      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;

      }


      if(existing){

        message(
          "Aaj ka attendance already laga hua hai. ⚠️"
        );

        return;

      }


      const hour =
        Number(
          now.time.slice(
            0,
            2
          )
        );


      const minute =
        Number(
          now.time.slice(
            3,
            5
          )
        );


      const late =
        hour > 9 ||

        (
          hour === 9 &&
          minute > 30
        );


      const status =
        late
          ? "Late"
          : "Present";


      const {

        error

      } =

        await db

          .from("attendance")

          .insert({

            employee_id:
              emp.id,

            attendance_date:
              now.date,

            check_in:
              now.time,

            status:
              status,

            check_in_lat:
              gps.latitude,

            check_in_lng:
              gps.longitude,

            check_in_accuracy:
              gps.accuracy

          });


      if(error){

        message(
          "Check-In error: " +
          error.message
        );

        return;

      }


      message(

        "Check-In successful ✅\n" +

        emp.name +

        "\nDistance: " +

        gps.distance +

        " meters"

      );

    }


    /* =====================================
       CHECK OUT
    ===================================== */

    else{

      const {

        data:attendance,

        error:findError

      } =

        await db

          .from("attendance")

          .select("*")

          .eq(
            "employee_id",
            emp.id
          )

          .eq(
            "attendance_date",
            now.date
          )

          .maybeSingle();


      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;

      }


      if(!attendance){

        message(
          "Aaj ka Check-In nahi mila."
        );

        return;

      }


      if(
        attendance.check_out
      ){

        message(
          "Check-Out already ho chuka hai."
        );

        return;

      }


      const {

        error

      } =

        await db

          .from("attendance")

          .update({

            check_out:
              now.time,

            check_out_lat:
              gps.latitude,

            check_out_lng:
              gps.longitude,

            check_out_accuracy:
              gps.accuracy

          })

          .eq(
            "id",
            attendance.id
          );


      if(error){

        message(
          "Check-Out error: " +
          error.message
        );

        return;

      }


      message(

        "Check-Out successful ✅\n" +

        emp.name +

        "\nDistance: " +

        gps.distance +

        " meters"

      );

    }

  }


  catch(error){

    message(
      error.message ||
      "Something went wrong."
    );

  }


  finally{

    checkInButton.disabled =
      false;

    checkOutButton.disabled =
      false;

    myAttendanceButton.disabled =
      false;

  }

}


/* =========================================
   MY ATTENDANCE
========================================= */

async function showMyAttendance(){

  myAttendanceButton.disabled =
    true;


  try{

    const emp =
      await verifyEmployee();


    if(!emp)
      return;


    reportCard.style.display =
      "block";


    employeeName.textContent =
      emp.name +
      " (" +
      emp.employee_id +
      ")";


    reportMsg.textContent =
      "Attendance load ho rahi hai...";


    reportBody.innerHTML =
      "";


    /* =====================================
       SECURE SUPABASE FUNCTION
    ===================================== */

    const {

      data,

      error

    } =

      await db.rpc(
        "get_my_attendance",
        {

          p_employee_id:
            emp.employee_id,

          p_pin:
            emp.pin

        }
      );


    if(error){

      reportMsg.textContent =
        "Report error: " +
        error.message;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      reportMsg.textContent =
        "Abhi attendance record nahi mila.";

      return;

    }


    data.forEach(
      row => {

        const tr =
          document.createElement(
            "tr"
          );


        tr.innerHTML =

          "<td>" +
          (
            row.attendance_date ||
            "-"
          ) +
          "</td>" +

          "<td>" +
          (
            row.check_in ||
            "-"
          ) +
          "</td>" +

          "<td>" +
          (
            row.check_out ||
            "-"
          ) +
          "</td>" +

          "<td>" +
          (
            row.status ||
            "-"
          ) +
          "</td>";


        reportBody.appendChild(
          tr
        );

      }
    );


    reportMsg.textContent =
      "Total records: " +
      data.length;


  }


  catch(error){

    reportMsg.textContent =
      "Something went wrong.";

  }


  finally{

    myAttendanceButton.disabled =
      false;

  }

}


/* =========================================
   BUTTON EVENTS
========================================= */

checkInButton.addEventListener(
  "click",
  () => mark("in")
);


checkOutButton.addEventListener(
  "click",
  () => mark("out")
);


myAttendanceButton.addEventListener(
  "click",
  showMyAttendance
);

</script>
