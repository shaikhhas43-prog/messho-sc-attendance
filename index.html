/* =====================================================
   DEVICE ID
===================================================== */

/*
 Browser actual IMEI/serial number nahi deta.

 Isliye ek permanent browser ID generate karte hain.
*/

function getDeviceId(){

  let id = localStorage.getItem(
    "messho_sc_device_id"
  );

  if(!id){

    if(
      window.crypto &&
      crypto.randomUUID
    ){

      id = crypto.randomUUID();

    }else{

      id =
        "DEVICE-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,10);

    }

    localStorage.setItem(
      "messho_sc_device_id",
      id
    );
  }

  return id;
}

/* =====================================================
   INDIA DATE TIME
===================================================== */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false,
        weekday:"long"
      }
    ).formatToParts(new Date());

  const get =
    type =>
      parts.find(
        p => p.type === type
      )?.value;

  return {

    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")
  };
}


/* =====================================================
   DISTANCE
===================================================== */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRadians =
    value =>
      value * Math.PI / 180;

  const dLat =
    toRadians(lat2-lat1);

  const dLon =
    toRadians(lon2-lon1);

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRadians(lat1)) *
    Math.cos(toRadians(lat2)) *
    Math.sin(dLon/2)**2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


/* =====================================================
   GPS
===================================================== */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Is device me GPS support nahi hai."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          const distance =
            distanceInMeters(
              lat,
              lng,
              OFFICE_LAT,
              OFFICE_LNG
            );

          console.log(
            "Latitude:",
            lat
          );

          console.log(
            "Longitude:",
            lng
          );

          console.log(
            "Accuracy:",
            accuracy
          );

          console.log(
            "Office Distance:",
            distance
          );

          if(
            distance >
            OFFICE_RADIUS_METERS
          ){

            reject(
              new Error(
                "Attendance blocked ❌\n\n" +
                "Aap office area se bahar ho.\n" +
                "Distance: " +
                Math.round(distance) +
                " meters\n\n" +
                "Attendance sirf office ke 150 meter area me lagegi."
              )
            );

            return;
          }

          resolve({

            latitude:lat,

            longitude:lng,

            accuracy:accuracy,

            distance:
              Math.round(distance)

          });

        },

        error => {

          console.error(
            "GPS Error:",
            error
          );

          let text =
            "GPS location nahi mil rahi.";

          if(error.code === 1){

            text =
              "GPS permission Allow karo.";

          }else if(error.code === 2){

            text =
              "Phone ka Location ON karo.";

          }else if(error.code === 3){

            text =
              "GPS timeout. Dobara try karo.";

          }

          reject(
            new Error(text)
          );

        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }

      );

    }
  );
}

const cameraModal =

const cameraTitle =
  document.getElementById(
    "cameraTitle"
  );

let cameraStream = null;
let capturedPhoto = "";
let pendingType = null;


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(type){

  pendingType = type;

  capturedPhoto = "";

  cameraTitle.textContent =
    type === "in"
      ? "📸 Check-In Photo"
      : "📸 Check-Out Photo";

  photoPreview.style.display =
    "none";

  capturePhoto.style.display =
    "block";

  usePhoto.style.display =
    "none";

  retakePhoto.style.display =
    "none";

  cameraModal.style.display =
    "block";

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });

    cameraVideo.srcObject =
      cameraStream;

  }catch(error){

    console.error(error);

    cameraModal.style.display =
      "none";

    message(
      "Camera permission Allow karo. 📷",
      "error"
    );
  }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    cameraStream = null;
  }

  cameraVideo.srcObject = null;
}


/* =====================================================
   CAPTURE PHOTO
===================================================== */

capturePhoto.onclick = () => {

  if(
    !cameraVideo.videoWidth
  ){

    message(
      "Camera ready nahi hai. Thoda wait karo.",
      "error"
    );

    return;
  }

  const width =
    cameraVideo.videoWidth;

  const height =
    cameraVideo.videoHeight;

  const maxWidth = 900;

  const scale =
    Math.min(
      1,
      maxWidth / width
    );

  cameraCanvas.width =
    Math.round(width*scale);

  cameraCanvas.height =
    Math.round(height*scale);

  const ctx =
    cameraCanvas.getContext("2d");

  ctx.drawImage(
    cameraVideo,
    0,
    0,
    cameraCanvas.width,
    cameraCanvas.height
  );

  capturedPhoto =
    cameraCanvas.toDataURL(
      "image/jpeg",
      0.65
    );

  photoPreview.src =
    capturedPhoto;

  photoPreview.style.display =
    "block";

  capturePhoto.style.display =
    "none";

  usePhoto.style.display =
    "block";

  retakePhoto.style.display =
    "block";

};


/* =====================================================
   RETAKE
===================================================== */

retakePhoto.onclick = () => {

  capturedPhoto = "";

  photoPreview.style.display =
    "none";

  capturePhoto.style.display =
    "block";

  usePhoto.style.display =
    "none";

  retakePhoto.style.display =
    "none";
};


/* =====================================================
   CLOSE
===================================================== */

closeCamera.onclick = () => {

  stopCamera();

  cameraModal.style.display =
    "none";

  capturedPhoto = "";
};


/* =====================================================
   USE PHOTO
===================================================== */

usePhoto.onclick = () => {

  if(!capturedPhoto){

    message(
      "Pehle photo capture karo.",
      "error"
    );

    return;
  }

  stopCamera();

  cameraModal.style.display =
    "none";

  mark(
    pendingType,
    capturedPhoto
  );
};


/* =====================================================
   HOLIDAY / WEEK OFF
===================================================== */

function isHoliday(date){

  return COMPANY_HOLIDAYS
    .includes(date);
}


function isWeeklyOff(
  employee,
  weekday
){

  if(!employee.week_off)
    return false;

  return String(
    employee.week_off
  )
    .trim()
    .toLowerCase()
    ===
    weekday
      .toLowerCase();
}


/* =====================================================
   SAVE DEVICE ID
===================================================== */

async function saveDeviceId(
  employee
){

  /*
   Best effort:
   Agar Supabase UPDATE policy allow karti hai
   to employees table me device_id save hoga.
  */

  if(
    employee.device_id === DEVICE_ID
  ){
    return;
  }

  if(
    employee.device_id
  ){
    return;
  }

  try{

    const result =
      await db
        .from("employees")
        .update({
          device_id:DEVICE_ID
        })
        .eq("id",employee.id);

    if(result.error){

      console.warn(
        "Device ID save blocked:",
        result.error.message
      );

    }

  }catch(error){

    console.warn(
      "Device ID update failed",
      error
    );

  }
}


/* =====================================================
   MARK ATTENDANCE
===================================================== */

async function mark(
  type,
  photo
){

  const id =
    employeeIdInput

      .toUpperCase();

    pinInput

        )

          "employee_id",
          id

        .eq(
          "pin",
          pin
        )

        )

    }


    /* =====================================
       DEVICE ID
    ===================================== */

       DATE

      );

      return;
    }


    if(

    ){

      message(
        "Aaj aapka weekly off hai. 🛑",

      );

    }


    /* =====================================
       GPS

      "GPS location verify ho rahi hai..."

        );

      const hour =
        Number(

        );


      const late =
        hour > 9 ||
        (
          hour === 9 &&

        );


      const status =
        late
          ? "Late"
          : "Present";


      const insertData = {

        employee_id:

        attendance_date:
          now.date,

        check_in:
          now.time,

        status:
          status,

        check_in_lat:
          gps.latitude,

        check_in_lng:
          gps.longitude,

        check_in_accuracy:
          gps.accuracy

      };


      /*
       Photo column agar table me hai
       to photo save hogi.
      */

      if(photo){
