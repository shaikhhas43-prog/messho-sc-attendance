<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messho SC Attendance</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#172033;color:#fff;padding:18px}main{max-width:700px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0;font-weight:bold}.out{background:#d92d20}#msg{padding:10px;background:#eef4ff;border-radius:10px}</style></head>
<body><header><h1>Messho SC</h1><div>Staff Attendance • Shift 09:30 AM–06:00 PM</div></header><main><div class="card"><h2>Attendance</h2><input id="id" placeholder="Employee ID (e.g. EMP001)"><input id="pin" type="password" placeholder="PIN"><button onclick="mark('in')">🟢 Check In</button><button class="out" onclick="mark('out')">🔴 Check Out</button><div id="msg">Enter Employee ID and PIN.</div></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://iijuflktxqqtgjbdywwj.supabase.co','sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0');
const msg=t=>document.getElementById('msg').textContent=t;
function gps(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>no('GPS permission allow karo.'),{enableHighAccuracy:true,timeout:10000,maximumAge:0}))}
async function mark(type){
 const id=document.getElementById('id').value.trim().toUpperCase(),pin=document.getElementById('pin').value.trim();
 if(!id||!pin)return msg('Employee ID aur PIN bharo.');
 msg('GPS verify ho raha hai...');
 try{
  const c=await gps();
  const {data:e,error:ee}=await sb.from('employees').select('*').eq('employee_id',id).eq('pin',pin).single();
  if(ee||!e)return msg('Employee ID/PIN incorrect.');
  const now=new Date(),date=now.toISOString().slice(0,10),time=now.toTimeString().slice(0,5);
  if(type==='in'){
   const day=now.toLocaleDateString('en-US',{weekday:'long'});
   const late=(now.getHours()>9)||(now.getHours()===9&&now.getMinutes()>30);
   const {data:old}=await sb.from('attendance').select('id').eq('employee_id',e.id).eq('attendance_date',date).maybeSingle();
   if(old)return msg('Aaj ka attendance already hai.');
   const status=e.week_off===day?'Week-off':late?'Late':'Present';
   const {error}=await sb.from('attendance').insert({employee_id:e.id,attendance_date:date,check_in:time,status,check_in_lat:c.latitude,check_in_lng:c.longitude,check_in_accuracy:c.accuracy});
   if(error)throw error; msg('Check-In successful ✅');
  } else {
   const {data:r}=await sb.from('attendance').select('*').eq('employee_id',e.id).eq('attendance_date',date).maybeSingle();
   if(!r)return msg('Aaj ka Check-In nahi mila.');
   const {error}=await sb.from('attendance').update({check_out:time,check_out_lat:c.latitude,check_out_lng:c.longitude,check_out_accuracy:c.accuracy}).eq('id',r.id);
   if(error)throw error; msg('Check-Out successful ✅');
  }
 }catch(x){msg('Attendance failed: '+(x.message||x))}
}
</script></body></html>
