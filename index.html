/* =========================================
   OFFICE LOCATION
========================================= */

const OFFICE_LAT = 19.307765;

const OFFICE_LNG = 73.071277;

const OFFICE_RADIUS_METERS = 150;



/* =========================================
   COMPANY HOLIDAYS
========================================= */

const COMPANY_HOLIDAYS = [

  // Example:
  // "2026-08-15"

];



/* =========================================

const msg =

/* =========================================
   MESSAGE
========================================= */

function message(text,type=""){

  msg.textContent = text;

  msg.className = "";

  if(type){

    msg.classList.add(type);

  }

}



/* =========================================
   DEVICE ID
========================================= */

/*
   APK mein AndroidDevice available ho
   to uska real device ID use hoga.

   Normal Chrome/browser mein localStorage
   se ek unique ID generate hogi.
*/

function getDeviceId(){

  try{

    /* -------------------------------
       APK DEVICE ID
    ------------------------------- */

    if(
      window.AndroidDevice &&
      typeof window.AndroidDevice.getDeviceId ===
      "function"
    ){

      const androidId =
        window.AndroidDevice.getDeviceId();

      if(
        androidId &&
        String(androidId).trim()
      ){

        return String(androidId).trim();

      }

    }


    /* -------------------------------
       BROWSER DEVICE ID
    ------------------------------- */

    const storageKey =
      "messho_sc_device_id";


    let browserDeviceId =
      localStorage.getItem(storageKey);


    if(!browserDeviceId){

      if(
        window.crypto &&
        typeof crypto.randomUUID ===
        "function"
      ){

        browserDeviceId =
          "WEB-" +
          crypto.randomUUID();

      }else{

        browserDeviceId =
          "WEB-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);

      }


      localStorage.setItem(
        storageKey,
        browserDeviceId
      );

    }


    return browserDeviceId;


  }catch(error){

    console.error(
      "Device ID error:",
      error
    );


    return "";

  }

}



/* =========================================
   INDIA DATE/TIME
========================================= */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false,
        weekday:"long"
      }
    ).formatToParts(
      new Date()
    );


  const get =
    type =>
      parts.find(
        p => p.type === type
      )?.value;


  return {

    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")

  };

}



/* =========================================
   DISTANCE CALCULATION
========================================= */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;


  const toRadians =
    value =>
      value * Math.PI / 180;


  const dLat =
    toRadians(
      lat2 - lat1
    );


  const dLon =
    toRadians(
      lon2 - lon1
    );


  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(
      toRadians(lat1)
    ) *

    Math.cos(
      toRadians(lat2)
    ) *

    Math.sin(dLon / 2) ** 2;


  const c =
    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}



/* =========================================
   GPS
========================================= */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "Is device par GPS available nahi hai."
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;


          const lng =
            position.coords.longitude;


          const accuracy =
            position.coords.accuracy;


          const distance =
            distanceInMeters(
              lat,
              lng,
              OFFICE_LAT,
              OFFICE_LNG
            );


          if(
            distance >
            OFFICE_RADIUS_METERS
          ){

            reject(
              new Error(
                "Attendance blocked ❌\n\n" +
                "Aap office area se bahar ho.\n" +
                "Distance: " +
                Math.round(distance) +
                " meters"
              )
            );

            return;

          }


          resolve({

            latitude:lat,

            longitude:lng,

            accuracy:accuracy,

            distance:
              Math.round(distance)

          });

        },


        error => {

          if(error.code === 1){

            reject(
              new Error(
                "GPS permission Allow karo."
              )
            );

          }

          else if(error.code === 2){

            reject(
              new Error(
                "Phone ka Location ON karo."
              )
            );

          }

          else if(error.code === 3){

            reject(
              new Error(
                "GPS timeout. Dobara try karo."
              )
            );

          }

          else{

            reject(
              new Error(
                "GPS location nahi mil rahi."
              )
            );

          }

        },


        {

          enableHighAccuracy:true,

          timeout:15000,

          maximumAge:0

        }

      );

    }
  );

}



/* =========================================
   HOLIDAY
========================================= */

function isHoliday(date){

  return COMPANY_HOLIDAYS
    .includes(date);

}



/* =========================================
   WEEKLY OFF
========================================= */

function isWeeklyOff(
  employee,
  weekday
){

  if(!employee.week_off){

    return false;

  }


  return String(
    employee.week_off
  )
  .trim()
  .toLowerCase()
  ===
  weekday.toLowerCase();

}



/* =========================================
   VERIFY EMPLOYEE
========================================= */

async function verifyEmployee(){

  const id =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(!id || !pin){

    message(
      "Employee ID aur PIN bharo.",
      "error"
    );

    return null;

  }



  /* -------------------------------
     DATABASE LOGIN
  ------------------------------- */

  const {

    data:emp,

    error

  } = await db

    .from("employees")

    .select(
      "id,employee_id,name,pin,week_off,active,device_id"
    )

    .eq(
      "employee_id",
      id
    )

    .eq(
      "pin",
      pin
    )

    .eq(
      "active",
      true
    )

    .maybeSingle();



  if(error){

    console.error(error);


    message(
      "Database error: " +
      error.message,
      "error"
    );


    return null;

  }



  if(!emp){

    message(
      "Employee ID/PIN incorrect.",
      "error"
    );


    return null;

  }



  /* =====================================
     DEVICE BINDING
  ===================================== */

  const currentDevice =
    getDeviceId();


  if(!currentDevice){

    message(
      "Device ID generate nahi hua.\n" +
      "Browser ko refresh karke dobara try karo.",
      "error"
    );


    return null;

  }



  /*
    Agar employee ka device_id NULL hai,
    to current device register hoga.
  */

  if(!emp.device_id){

    const {

      error:bindError

    } = await db

      .from("employees")

      .update({

        device_id:
          currentDevice

      })

      .eq(
        "id",
        emp.id
      );



    if(bindError){

      console.error(
        bindError
      );


      message(
        "Device binding error: " +
        bindError.message,
        "error"
      );


      return null;

    }


    emp.device_id =
      currentDevice;


  }

  else if(
    emp.device_id !==
    currentDevice
  ){

    message(
      "Attendance blocked ❌\n\n" +
      "Ye Employee ID kisi doosre device se linked hai.\n\n" +
      "Registered device se attendance lagao.",
      "error"
    );


    return null;

  }



  return emp;

}



/* =========================================
   MARK ATTENDANCE
========================================= */

async function mark(type){

  checkInButton.disabled = true;

  checkOutButton.disabled = true;


  try{

    message(
      "Employee verify ho raha hai..."
    );


    const emp =
      await verifyEmployee();


    if(!emp){

      return;

    }



    const now =
      getIndiaDateTime();



    /* -------------------------------
       HOLIDAY
    ------------------------------- */

    if(
      isHoliday(now.date)
    ){

      message(
        "Aaj company holiday hai. 🛑",
        "error"
      );


      return;

    }



    /* -------------------------------
       WEEK OFF
    ------------------------------- */

    if(
      isWeeklyOff(
        emp,
        now.weekday
      )
    ){

      message(
        "Aaj aapka weekly off hai. 🛑",
        "error"
      );


      return;

    }



    message(
      "GPS location verify ho rahi hai..."
    );



    const gps =
      await getGPS();



    /* =====================================
       CHECK IN
    ===================================== */

    if(type === "in"){

      const {

        data:existing,

        error:findError

      } = await db

        .from("attendance")

        .select(
          "id,check_in,check_out"
        )

        .eq(
          "employee_id",
          emp.id
        )

        .eq(
          "attendance_date",
          now.date
        )

        .maybeSingle();



      if(findError){

        message(
          "Attendance check error: " +
          findError.message,
          "error"
        );


        return;

      }



      if(existing){

        message(
          "Aaj ka attendance already laga hua hai. ⚠️",
          "error"
        );


        return;

      }



      /* -------------------------------
         LATE CALCULATION
      ------------------------------- */

      const hour =
        Number(
          now.time.slice(0,2)
        );


      const minute =
        Number(
          now.time.slice(3,5)
        );


      const late =
        hour > 9 ||
        (
          hour === 9 &&
          minute > 30
        );


      const status =
        late
          ? "Late"
          : "Present";



      /* -------------------------------
         INSERT ATTENDANCE
      ------------------------------- */

      const {

        error

      } = await db

        .from("attendance")

        .insert({

          employee_id:
            emp.id,

          attendance_date:
            now.date,

          check_in:
            now.time,

          status:
            status,

          check_in_lat:
            gps.latitude,

          check_in_lng:
            gps.longitude,

          check_in_accuracy:
            gps.accuracy

        });



      if(error){

        console.error(error);


        if(
          error.message &&
          error.message.includes(
            "attendance_employee_id_attendance_date_key"
          )
        ){

          message(
            "Aaj ka attendance already laga hua hai. ⚠️",
            "error"
          );

        }

        else{

          message(
            "Check-In error: " +
            error.message,
            "error"
          );

        }


        return;

      }



      message(
        "Check-In successful ✅\n\n" +
        "Time: " +
        now.time +
        "\n" +
        "Status: " +
        status +
        "\n" +
        "Office distance: " +
        gps.distance +
        " meters",
        "success"
      );

    }



    /* =====================================
       CHECK OUT
    ===================================== */

    else{

      const {

        data:attendance,

        error:findError

      } = await db

        .from("attendance")

        .select("*")

        .eq(
          "employee_id",
          emp.id
        )

        .eq(
          "attendance_date",
          now.date
        )

        .maybeSingle();



      if(findError){

        message(
          "Attendance check error: " +
          findError.message,
          "error"
        );


        return;

      }



      if(!attendance){

        message(
          "Aaj ka Check-In nahi mila.",
          "error"
        );


        return;

      }



      if(attendance.check_out){

        message(
          "Check-Out already ho chuka hai.",
          "error"
        );


        return;

      }



      /* -------------------------------
         UPDATE CHECK OUT
      ------------------------------- */

      const {

        error

      } = await db

        .from("attendance")

        .update({

          check_out:
            now.time,

          check_out_lat:
            gps.latitude,

          check_out_lng:
            gps.longitude,

          check_out_accuracy:
            gps.accuracy

        })

        .eq(
          "id",
          attendance.id
        );



      if(error){

        message(
          "Check-Out error: " +
          error.message,
          "error"
        );


        return;

      }



      message(
        "Check-Out successful ✅\n\n" +
        "Time: " +
        now.time +
        "\n" +
        "Office distance: " +
        gps.distance +
        " meters",
        "success"
      );

    }


  }

  catch(error){

    console.error(error);


    message(
      error.message ||
      "Something went wrong.",
      "error"
    );

  }


  finally{

    checkInButton.disabled = false;

    checkOutButton.disabled = false;

  }

}



/* =========================================
   MY ATTENDANCE
========================================= */

async function showMyAttendance(){

  reportCard.style.display =
    "block";


  reportMsg.textContent =
    "Employee verify ho raha hai...";


  reportBody.innerHTML = "";



  const emp =
    await verifyEmployee();



  if(!emp){

    reportMsg.textContent =
      "Employee verify nahi hua.";

    return;

  }



  employeeName.textContent =
    emp.name +
    " • " +
    emp.employee_id;



  reportMsg.textContent =
    "Attendance load ho rahi hai...";



  /* =====================================
     REPORT
  ===================================== */

  const {

    data,

    error

  } = await db

    .from("attendance_report")

    .select(
      "attendance_date,check_in,check_out,status"
    )

    .eq(
      "employee_id",
      emp.employee_id
    )

    .order(
      "attendance_date",
      {
        ascending:false
      }
    );



  if(error){

    console.error(error);


    reportMsg.textContent =
      "Report error: " +
      error.message;


    return;

  }



  reportBody.innerHTML = "";



  if(
    !data ||
    data.length === 0
  ){

    reportMsg.textContent =
      "Abhi attendance record nahi mila.";

    return;

  }



  reportMsg.textContent =
    data.length +
    " attendance record found.";



  data.forEach(
    row => {

      const tr =
        document.createElement(
          "tr"
        );


      let statusClass = "";


      if(
        String(row.status)
          .toLowerCase()
          .includes("late")
      ){

        statusClass =
          "status-late";

      }

      else if(
        String(row.status)
          .toLowerCase()
          .includes("present")
      ){

        statusClass =
          "status-present";

      }

      else if(
        String(row.status)
          .toLowerCase()
          .includes("absent")
      ){

        statusClass =
          "status-absent";

      }



      tr.innerHTML = `

        <td>
          ${row.attendance_date || "-"}
        </td>

        <td>
          ${row.check_in || "-"}
        </td>

        <td>
          ${row.check_out || "-"}
        </td>

        <td class="${statusClass}">
          ${row.status || "-"}
        </td>

      `;


      reportBody.appendChild(tr);

    }

  );

}



/* =========================================
   BUTTONS
========================================= */

checkInButton.addEventListener(

myAttendanceButton.addEventListener(

      if(
        event.key === "Enter"

        mark("in");
