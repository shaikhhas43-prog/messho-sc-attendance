<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messho SC Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#172033;color:#fff;padding:18px}
.headerRow{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}
.logoWrap{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 58px;border:3px solid #2563eb}
.logoWrap img{width:100%;height:100%;object-fit:cover;display:none}
.logoFallback{color:#172033;font-weight:900;font-size:15px;text-align:center;line-height:1.05}
header h1{margin:0 0 5px;font-size:28px}
header p{margin:0;font-size:14px;color:#e5e7eb}
main{max-width:650px;margin:24px auto;padding:0 15px}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h2{margin-top:0}
input,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #d8dce5}
button{border:0;color:#fff;font-weight:bold;cursor:pointer;background:#2563eb}
button.out{background:#d92d20}
button.dark{background:#172033}
button.gray{background:#64748b}
button:disabled{opacity:.55;cursor:not-allowed}
#msg,#reportMsg{margin-top:12px;padding:13px;background:#eef4ff;border-radius:10px;white-space:pre-line}
#reportCard{display:none;margin-top:18px}
.record{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0;background:#fafcff}
.record strong{display:block;margin-bottom:5px}
.photo{width:100%;max-height:250px;object-fit:cover;border-radius:10px;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;padding:18px;overflow:auto}
.modalBox{max-width:520px;margin:20px auto;background:#fff;border-radius:16px;padding:16px}
#cameraVideo{width:100%;min-height:220px;background:#111;border-radius:12px;display:block}
#photoPreview{display:none;width:100%;max-height:350px;object-fit:cover;border-radius:12px}
.small{font-size:13px;color:#64748b;margin-top:10px}
.statusLine{margin-top:10px;padding:10px;border-radius:9px;background:#f8fafc;font-size:13px}
.footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
</style>
</head>
<body>

<header>
  <div class="headerRow">
    <div class="logoWrap">
      <img id="companyLogo" src="logo.png" alt="Messho SC logo">
      <div id="logoFallback" class="logoFallback">MESSHO<br>SC</div>
    </div>
    <div>
      <h1>Messho SC</h1>
      <p>Staff Attendance - Shift 09:30 AM - 06:00 PM</p>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h2>Attendance</h2>

    <input id="employeeId" placeholder="Employee ID (e.g. EMP001)" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">

    <button id="checkIn">Check In</button>
    <button id="checkOut" class="out">Check Out</button>
    <button id="myAttendance" class="dark">My Attendance</button>

    <div id="msg">Enter Employee ID and PIN.</div>
    <div class="statusLine">This device is used for employee device locking.</div>
  </div>

  <div id="reportCard" class="card">
    <h2>My Attendance</h2>
    <div id="reportMsg">Loading...</div>
    <div id="records"></div>
  </div>
</main>

<div id="cameraModal" class="modal">
  <div class="modalBox">
    <h2 id="cameraTitle">Take Photo</h2>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <img id="photoPreview" alt="Photo preview">

    <button id="capturePhoto" disabled>Take Photo</button>
    <button id="retakePhoto" class="gray" style="display:none">Retake Photo</button>
    <button id="usePhoto" style="display:none">Use Photo</button>
    <button id="closeCamera" class="out">Cancel</button>

    <div id="cameraStatus" class="small">Starting camera...</div>
  </div>
</div>

<div class="footer">Messho SC Staff Attendance</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* SUPABASE */
const SUPABASE_URL="https://iijuflktxqqtgjbdywwj.supabase.co";
const SUPABASE_KEY="sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* OFFICE */
const OFFICE_LAT=19.307765;
const OFFICE_LNG=73.071277;
const OFFICE_RADIUS_METERS=150;
const COMPANY_HOLIDAYS=[];

/* ELEMENTS */
const msg=document.getElementById("msg");
const checkInButton=document.getElementById("checkIn");
const checkOutButton=document.getElementById("checkOut");
const myAttendanceButton=document.getElementById("myAttendance");
const cameraModal=document.getElementById("cameraModal");
const cameraTitle=document.getElementById("cameraTitle");
const cameraVideo=document.getElementById("cameraVideo");
const photoPreview=document.getElementById("photoPreview");
const capturePhoto=document.getElementById("capturePhoto");
const retakePhoto=document.getElementById("retakePhoto");
const usePhoto=document.getElementById("usePhoto");
const closeCamera=document.getElementById("closeCamera");
const cameraStatus=document.getElementById("cameraStatus");

let cameraStream=null;
let pendingType=null;
let capturedPhoto="";

/* LOGO: upload your logo as logo.png in the same GitHub folder */
const companyLogo=document.getElementById("companyLogo");
const logoFallback=document.getElementById("logoFallback");
companyLogo.addEventListener("load",function(){
  companyLogo.style.display="block";
  logoFallback.style.display="none";
});
companyLogo.addEventListener("error",function(){
  companyLogo.style.display="none";
  logoFallback.style.display="block";
});

/* DEVICE ID */
function getDeviceId(){
  let id=localStorage.getItem("messho_device_id");
  if(!id){
    if(window.crypto&&crypto.randomUUID){
      id="DEV-"+crypto.randomUUID();
    }else{
      id="DEV-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    }
    localStorage.setItem("messho_device_id",id);
  }
  return id;
}
const DEVICE_ID=getDeviceId();

/* MESSAGE */
function message(text){msg.textContent=String(text)}

/* INDIA TIME */
function getIndiaDateTime(){
  const parts=new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",weekday:"long",hour12:false
  }).formatToParts(new Date());

  function get(type){
    const item=parts.find(p=>p.type===type);
    return item?item.value:"";
  }

  return {
    date:get("year")+"-"+get("month")+"-"+get("day"),
    time:get("hour")+":"+get("minute"),
    weekday:get("weekday")
  };
}

/* DISTANCE */
function distanceInMeters(lat1,lon1,lat2,lon2){
  const R=6371000;
  const rad=v=>v*Math.PI/180;
  const dLat=rad(lat2-lat1);
  const dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* GPS */
function getGPS(){
  return new Promise(function(resolve,reject){
    if(!navigator.geolocation){
      reject(new Error("GPS is not available in this browser."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position){
        const lat=position.coords.latitude;
        const lng=position.coords.longitude;
        const accuracy=position.coords.accuracy;
        const distance=distanceInMeters(lat,lng,OFFICE_LAT,OFFICE_LNG);

        if(distance>OFFICE_RADIUS_METERS){
          reject(new Error(
            "Attendance blocked.\nYou are outside the office area.\nDistance: "+
            Math.round(distance)+" meters."
          ));
          return;
        }

        resolve({
          latitude:lat,longitude:lng,accuracy:accuracy,
          distance:Math.round(distance)
        });
      },
      function(error){
        if(error.code===1){
          reject(new Error("Location permission is denied. Allow location and try again."));
        }else if(error.code===2){
          reject(new Error("Phone Location is OFF. Turn it ON and try again."));
        }else if(error.code===3){
          reject(new Error("GPS timeout. Turn Location ON and try again."));
        }else{
          reject(new Error("GPS location could not be found."));
        }
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}

/* EMPLOYEE + DEVICE LOCK */
async function verifyEmployee(){
  const id=document.getElementById("employeeId").value.trim().toUpperCase();
  const pin=document.getElementById("pin").value.trim();

  if(!id||!pin){
    message("Employee ID and PIN are required.");
    return null;
  }

  const {data:claim,error:claimError}=await db.rpc("claim_employee_device",{
    p_employee_id:id,p_pin:pin,p_device_id:DEVICE_ID
  });

  if(claimError){
    console.error(claimError);
    message("Device verification error:\n"+claimError.message);
    return null;
  }

  const result=Array.isArray(claim)?claim[0]:claim;

  if(!result||result.success!==true){
    message(
      "Attendance blocked.\n\n"+
      (result&&result.message?result.message:
      "This employee is registered on another device.")
    );
    return null;
  }

  const {data:emp,error:empError}=await db.from("employees")
    .select("id,employee_id,name,pin,week_off,active,device_id")
    .eq("employee_id",id).eq("active",true).maybeSingle();

  if(empError){
    message("Employee database error: "+empError.message);
    return null;
  }

  if(!emp){
    message("Employee not found.");
    return null;
  }

  return emp;
}

/* CAMERA */
async function openCamera(type){
  pendingType=type;
  capturedPhoto="";

  cameraTitle.textContent=type==="in"?"Check In Photo":"Check Out Photo";
  cameraModal.style.display="block";
  cameraVideo.style.display="block";
  photoPreview.style.display="none";
  capturePhoto.style.display="block";
  capturePhoto.disabled=true;
  retakePhoto.style.display="none";
  usePhoto.style.display="none";
  cameraStatus.textContent="Starting camera...";

  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error("Camera is not supported.");
    }

    stopCamera();

    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    cameraVideo.srcObject=cameraStream;
    await cameraVideo.play();
    await waitForCameraReady();

    capturePhoto.disabled=false;
    cameraStatus.textContent="Camera ready. You can take the photo.";
  }catch(error){
    console.error(error);
    stopCamera();
    cameraModal.style.display="none";
    message("Camera permission Allow karo aur dobara try karo.");
  }
}

function waitForCameraReady(){
  return new Promise(function(resolve,reject){
    const start=Date.now();

    function check(){
      if(cameraVideo.readyState>=2&&cameraVideo.videoWidth>0&&cameraVideo.videoHeight>0){
        resolve();
        return;
      }
      if(Date.now()-start>10000){
        reject(new Error("Camera timeout."));
        return;
      }
      requestAnimationFrame(check);
    }
    check();
  });
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(function(track){track.stop()});
    cameraStream=null;
  }
  cameraVideo.srcObject=null;
}

capturePhoto.addEventListener("click",function(){
  if(cameraVideo.readyState<2||!cameraVideo.videoWidth||!cameraVideo.videoHeight){
    cameraStatus.textContent="Camera is still starting. Please wait.";
    return;
  }

  const canvas=document.createElement("canvas");
  const maxWidth=900;
  const scale=Math.min(1,maxWidth/cameraVideo.videoWidth);

  canvas.width=Math.round(cameraVideo.videoWidth*scale);
  canvas.height=Math.round(cameraVideo.videoHeight*scale);

  const ctx=canvas.getContext("2d");
  ctx.drawImage(cameraVideo,0,0,canvas.width,canvas.height);

  capturedPhoto=canvas.toDataURL("image/jpeg",0.72);
  photoPreview.src=capturedPhoto;
  photoPreview.style.display="block";
  cameraVideo.style.display="none";
  capturePhoto.style.display="none";
  retakePhoto.style.display="block";
  usePhoto.style.display="block";
  cameraStatus.textContent="Photo captured. Check the photo and use it.";
  stopCamera();
});

retakePhoto.addEventListener("click",function(){
  if(pendingType)openCamera(pendingType);
});

closeCamera.addEventListener("click",function(){
  stopCamera();
  cameraModal.style.display="none";
  pendingType=null;
  capturedPhoto="";
});

usePhoto.addEventListener("click",async function(){
  if(!capturedPhoto){
    message("Take a photo first.");
    return;
  }

  const type=pendingType;
  stopCamera();
  cameraModal.style.display="none";
  pendingType=null;
  await mark(type,capturedPhoto);
});

/* ATTENDANCE */
async function mark(type,photo){
  checkInButton.disabled=true;
  checkOutButton.disabled=true;
  myAttendanceButton.disabled=true;

  try{
    message("Employee verification in progress...");
    const emp=await verifyEmployee();
    if(!emp)return;

    const now=getIndiaDateTime();

    if(COMPANY_HOLIDAYS.includes(now.date)){
      message("Today is a company holiday.");
      return;
    }

    if(emp.week_off&&String(emp.week_off).trim().toLowerCase()===now.weekday.toLowerCase()){
      message("Today is your weekly off.\nAttendance is blocked.");
      return;
    }

    message("Checking office location...");
    const gps=await getGPS();

    if(type==="in"){
      const {data:existing,error:findError}=await db.from("attendance")
        .select("id,check_in,check_out")
        .eq("employee_id",emp.id)
        .eq("attendance_date",now.date)
        .maybeSingle();

      if(findError){
        message("Attendance check error: "+findError.message);
        return;
      }

      if(existing){
        message("Today's attendance is already marked.");
        return;
      }

      const hour=Number(now.time.substring(0,2));
      const minute=Number(now.time.substring(3,5));
      const status=(hour>9||(hour===9&&minute>30))?"Late":"Present";

      const {error}=await db.from("attendance").insert({
        employee_id:emp.id,
        attendance_date:now.date,
        check_in:now.time,
        status:status,
        check_in_lat:gps.latitude,
        check_in_lng:gps.longitude,
        check_in_accuracy:gps.accuracy,
        check_in_photo:photo
      });

      if(error){
        if(String(error.message).includes("attendance_employee_id_attendance_date_key")){
          message("Today's attendance is already marked.");
        }else{
          message("Check-In error: "+error.message);
        }
        return;
      }

      message(
        "Check-In successful.\n\n"+
        "Employee: "+emp.name+
        "\nTime: "+now.time+
        "\nDistance: "+gps.distance+" meters"
      );
      return;
    }

    const {data:attendance,error:findError}=await db.from("attendance")
      .select("*")
      .eq("employee_id",emp.id)
      .eq("attendance_date",now.date)
      .maybeSingle();

    if(findError){
      message("Attendance check error: "+findError.message);
      return;
    }

    if(!attendance){
      message("Today's Check-In was not found.");
      return;
    }

    if(attendance.check_out){
      message("Check-Out is already completed.");
      return;
    }

    const {error}=await db.from("attendance").update({
      check_out:now.time,
      check_out_lat:gps.latitude,
      check_out_lng:gps.longitude,
      check_out_accuracy:gps.accuracy,
      check_out_photo:photo
    }).eq("id",attendance.id);

    if(error){
      message("Check-Out error: "+error.message);
      return;
    }

    message(
      "Check-Out successful.\n\n"+
      "Employee: "+emp.name+
      "\nTime: "+now.time+
      "\nDistance: "+gps.distance+" meters"
    );
  }catch(error){
    console.error(error);
    message(error.message||"Something went wrong.");
  }finally{
    checkInButton.disabled=false;
    checkOutButton.disabled=false;
    myAttendanceButton.disabled=false;
  }
}

/* BUTTONS */
checkInButton.addEventListener("click",async function(){
  try{
    const emp=await verifyEmployee();
    if(emp)openCamera("in");
  }catch(error){
    console.error(error);
    message(error.message||"Unable to verify employee.");
  }
});

checkOutButton.addEventListener("click",async function(){
  try{
    const emp=await verifyEmployee();
    if(emp)openCamera("out");
  }catch(error){
    console.error(error);
    message(error.message||"Unable to verify employee.");
  }
});

/* MY ATTENDANCE */
myAttendanceButton.addEventListener("click",async function(){
  const id=document.getElementById("employeeId").value.trim().toUpperCase();
  const pin=document.getElementById("pin").value.trim();

  if(!id||!pin){
    message("Employee ID and PIN are required.");
    return;
  }

  const reportCard=document.getElementById("reportCard");
  const reportMsg=document.getElementById("reportMsg");
  const records=document.getElementById("records");

  reportCard.style.display="block";
  reportMsg.textContent="Loading attendance...";
  records.innerHTML="";

  try{
    const {data:emp,error:empError}=await db.from("employees")
      .select("id,employee_id,name,pin")
      .eq("employee_id",id).eq("pin",pin).eq("active",true).maybeSingle();

    if(empError)throw empError;

    if(!emp){
      reportMsg.textContent="Employee ID/PIN incorrect.";
      return;
    }

    const {data:list,error}=await db.from("attendance")
      .select("*")
      .eq("employee_id",emp.id)
      .order("attendance_date",{ascending:false})
      .limit(50);

    if(error)throw error;

    reportMsg.textContent=emp.name+" - "+emp.employee_id+"\n"+
      list.length+" record(s) found.";

    if(!list.length){
      records.innerHTML="<div class='record'>No attendance records found.</div>";
      return;
    }

    list.forEach(function(row){
      const div=document.createElement("div");
      div.className="record";

      const date=document.createElement("strong");
      date.textContent=row.attendance_date||"-";

      const status=document.createElement("div");
      status.textContent="Status: "+(row.status||"-");

      const checkIn=document.createElement("div");
      checkIn.textContent="Check In: "+(row.check_in||"-");

      const checkOut=document.createElement("div");
      checkOut.textContent="Check Out: "+(row.check_out||"-");

      div.appendChild(date);
      div.appendChild(status);
      div.appendChild(checkIn);
      div.appendChild(checkOut);

      if(row.check_in_photo){
        const img=document.createElement("img");
        img.className="photo";
        img.src=row.check_in_photo;
        img.alt="Check in photo";
        div.appendChild(img);
      }

      if(row.check_out_photo){
        const img=document.createElement("img");
        img.className="photo";
        img.src=row.check_out_photo;
        img.alt="Check out photo";
        div.appendChild(img);
      }

      records.appendChild(div);
    });
  }catch(error){
    console.error(error);
    reportMsg.textContent="Error: "+error.message;
  }
});
</script>
</body>
</html>
