<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Messho SC Attendance</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#172033;
  color:#fff;
  padding:20px;
}

main{
  max-width:650px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 18px #0001;
}

  background:#2563eb;

  font-weight:bold;
  cursor:pointer;
}

  opacity:.6;
  cursor:not-allowed;
}

.out{
  background:#d92d20;
}

#msg{
  margin-top:12px;

}

</style>

</head>

<body>

<header>
  <h1>Messho SC</h1>
  <div>Staff Attendance • Shift 09:30 AM–06:00 PM</div>
</header>

<main>

<div class="card">

<h2>Attendance</h2>

<input
  id="employeeId"
  placeholder="Employee ID (e.g. EMP001)"
  autocomplete="off"
>

<input
  id="pin"
  type="password"
  placeholder="PIN"
  autocomplete="off"
>

<button id="checkIn">
  🟢 Check In
</button>

<button id="checkOut" class="out">
  🔴 Check Out
</button>

<div id="msg">
  Enter Employee ID and PIN.
</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://iijuflktxqqtgjbdywwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   OFFICE GPS SETTINGS
========================================= */

const OFFICE_LAT = 19.307765;
const OFFICE_LNG = 73.071277;

/*
   Attendance allowed within 150 meters
   of the office.
*/

const OFFICE_RADIUS_METERS = 150;


/* =========================================
   ELEMENTS
========================================= */

const msg =
document.getElementById("msg");

const checkInButton =
document.getElementById("checkIn");

const checkOutButton =
document.getElementById("checkOut");


/* =========================================
   MESSAGE
========================================= */

function message(text){
  msg.textContent = text;
}


/* =========================================
   DISTANCE CALCULATION
   Haversine Formula
========================================= */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRadians =
    value => value * Math.PI / 180;

  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(toRadians(lat1)) *
    Math.cos(toRadians(lat2)) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =========================================
   GET GPS + VERIFY OFFICE LOCATION
========================================= */

function getGPS(){

  return new Promise((resolve,reject)=>{

    if(!navigator.geolocation){

      reject(
        new Error(
          "This browser does not support GPS."
        )
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      position => {

        const coords =
          position.coords;

        const employeeLat =
          coords.latitude;

        const employeeLng =
          coords.longitude;

        const accuracy =
          coords.accuracy;


        /* Distance from office */

        const distance =
          distanceInMeters(
            employeeLat,
            employeeLng,
            OFFICE_LAT,
            OFFICE_LNG
          );


        console.log(
          "Employee Latitude:",
          employeeLat
        );

        console.log(
          "Employee Longitude:",
          employeeLng
        );

        console.log(
          "GPS Accuracy:",
          accuracy
        );

        console.log(
          "Distance from office:",
          distance
        );


        /* =================================
           OFFICE RADIUS CHECK
        ================================= */

        if(distance > OFFICE_RADIUS_METERS){

          reject(
            new Error(
              "Attendance blocked ❌\n" +
              "You are outside the office area.\n" +
              "Distance: " +
              Math.round(distance) +
              " meters"
            )
          );

          return;
        }


        /* =================================
           GPS SUCCESS
        ================================= */

        resolve({

          latitude:
            employeeLat,

          longitude:
            employeeLng,

          accuracy:
            accuracy,

          distance:
            Math.round(distance)

        });

      },


      error => {

        console.error(
          "GPS Error:",
          error
        );

        reject(
          new Error(
            "GPS permission allow karo."
          )
        );

      },


      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }

    );

  });

}


/* =========================================
   ATTENDANCE FUNCTION
========================================= */

async function mark(type){

  const id =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  /* =================================
     CHECK INPUT
  ================================= */

  if(!id || !pin){

    message(
      "Employee ID aur PIN bharo."
    );

    return;
  }


  /* Disable buttons */

  checkInButton.disabled = true;
  checkOutButton.disabled = true;


  try{


    /* =================================
       EMPLOYEE VERIFICATION
    ================================= */

    message(
      "Employee verify ho raha hai..."
    );


    const {
      data: emp,
      error: empError
    } = await db
      .from("employees")
      .select(
        "id,employee_id,name,pin,week_off,active"
      )
      .eq("employee_id",id)
      .eq("pin",pin)
      .eq("active",true)
      .maybeSingle();


    if(empError){

      console.error(empError);

      message(
        "Database error: " +
        empError.message
      );

      return;
    }


    if(!emp){

      message(
        "Employee ID/PIN incorrect."
      );

      return;
    }


    /* =================================
       GPS VERIFICATION
    ================================= */

    message(
      "GPS location verify ho rahi hai..."
    );


    const gps =
      await getGPS();


    message(
      "Office location verified ✅"
    );


    /* =================================
       DATE & TIME
    ================================= */

    const now =
      new Date();


    const date =
      now.getFullYear() +
      "-" +
      String(
        now.getMonth() + 1
      ).padStart(2,"0") +
      "-" +
      String(
        now.getDate()
      ).padStart(2,"0");


    const time =
      String(
        now.getHours()
      ).padStart(2,"0") +
      ":" +
      String(
        now.getMinutes()
      ).padStart(2,"0");


    /* =================================
       CHECK IN
    ================================= */

    if(type === "in"){


      /* Find today's attendance */

      const {
        data: existing,
        error: findError
      } = await db
        .from("attendance")
        .select("id,check_in,check_out")
        .eq("employee_id",emp.id)
        .eq("attendance_date",date)
        .maybeSingle();


      if(findError){

        console.error(findError);

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }


      /* Duplicate protection */

      if(existing){

        message(
          "Aaj ka attendance already laga hua hai."
        );

        return;
      }


      /* =================================
         LATE STATUS
      ================================= */

      const day =
        now.toLocaleDateString(
          "en-US",
          {
            weekday:"long"
          }
        );


      const late =
        (now.getHours() > 9) ||
        (
          now.getHours() === 9 &&
          now.getMinutes() > 30
        );


      const status =
        emp.week_off === day
          ? "Week-off"
          : late
            ? "Late"
            : "Present";


      /* =================================
         INSERT ATTENDANCE
      ================================= */

      const {
        error
      } = await db
        .from("attendance")
        .insert({

          employee_id:
            emp.id,

          attendance_date:
            date,

          check_in:
            time,

          status:
            status,

          check_in_lat:
            gps.latitude,

          check_in_lng:
            gps.longitude,

          check_in_accuracy:
            gps.accuracy

        });


      if(error){

        console.error(error);

        message(
          "Check-In error: " +
          error.message
        );

        return;
      }


      message(
        "Check-In successful ✅\n" +
        "Distance from office: " +
        gps.distance +
        " meters"
      );

    }


    /* =================================
       CHECK OUT
    ================================= */

    else{


      const {
        data: attendance,
        error: findError
      } = await db
        .from("attendance")
        .select("*")
        .eq("employee_id",emp.id)
        .eq("attendance_date",date)
        .maybeSingle();


      if(findError){

        console.error(findError);

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }


      if(!attendance){

        message(
          "Aaj ka Check-In nahi mila."
        );

        return;
      }


      if(attendance.check_out){

        message(
          "Check-Out already ho chuka hai."
        );

        return;
      }


      /* =================================
         UPDATE CHECK OUT
      ================================= */

      const {
        error
      } = await db
        .from("attendance")
        .update({

          check_out:
            time,

          check_out_lat:
            gps.latitude,

          check_out_lng:
            gps.longitude,

          check_out_accuracy:
            gps.accuracy

        })
        .eq(
          "id",
          attendance.id
        );


      if(error){

        console.error(error);

        message(
          "Check-Out error: " +
          error.message
        );

        return;
      }


      message(
        "Check-Out successful ✅\n" +
        "Distance from office: " +
        gps.distance +
        " meters"
      );

    }


  }

  catch(error){

    console.error(error);

    message(
      error.message ||
      "Something went wrong."
    );

  }


  finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;

  }

}


/* =========================================
   BUTTON EVENTS
========================================= */

checkInButton.addEventListener(
  "click",
  () => mark("in")
);


checkOutButton.addEventListener(
  "click",
  () => mark("out")
);

</script>

</body>
