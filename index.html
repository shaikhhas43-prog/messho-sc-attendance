<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messho SC Attendance</title>

<style>
*{box-sizing:border-box}

body{

  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{

input{

}

  display:none;

  max-height:350px;

  border-radius:12px;

.small{
  font-size:13px;
  color:#64748b;

<body>

<header>
<h1>Messho SC</h1>
<p>Staff Attendance • Shift 09:30 AM–06:00 PM</p>
</header>

<main>

<div class="card">

<h2>Attendance</h2>

<input
 id="employeeId"
 placeholder="Employee ID (e.g. EMP001)"
 autocomplete="off">

<input
 id="pin"
 type="password"
 inputmode="numeric"
 placeholder="PIN"
 autocomplete="off">

<button id="checkIn">🟢 Check In</button>

<button id="checkOut" class="out">
🔴 Check Out
</button>

<button id="myAttendance" class="dark">
📋 My Attendance
</button>

<div id="msg">
Enter Employee ID and PIN.
</div>

</div>

<div id="reportCard" class="card">

<h2>My Attendance</h2>

<div id="reportMsg">Loading...</div>

<div id="records"></div>

</div>

</main>

<!-- CAMERA -->

<div id="cameraModal" class="modal">

<div class="modalBox">

<h2 id="cameraTitle">Take Photo</h2>

<video
 id="cameraVideo"
 autoplay
 playsinline>
</video>

<img
 id="photoPreview"
 alt="Photo">

<button id="capturePhoto">
📷 Take Photo
</button>

<button
 id="retakePhoto"
 class="gray"
 style="display:none">
Retake Photo
</button>

<button
 id="usePhoto"
 style="display:none">
Use Photo
</button>

<button
 id="closeCamera"
 class="out">
Cancel
</button>

<div class="small">
Camera photo is required for attendance.
</div>

</div>
</div>

<div class="footer">
Messho SC Staff Attendance
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://iijuflktxqqtgjbdywwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   OFFICE LOCATION
============================== */

const OFFICE_LAT = 19.307765;
const OFFICE_LNG = 73.071277;

const OFFICE_RADIUS_METERS = 150;


/* ==============================
   HOLIDAYS
============================== */

const COMPANY_HOLIDAYS = [];


/* ==============================
   ELEMENTS
============================== */

const msg =
document.getElementById("msg");

const checkInButton =
document.getElementById("checkIn");

const checkOutButton =
document.getElementById("checkOut");

const myAttendanceButton =
document.getElementById("myAttendance");

const cameraModal =
document.getElementById("cameraModal");

const cameraVideo =
document.getElementById("cameraVideo");

const photoPreview =
document.getElementById("photoPreview");

const capturePhoto =
document.getElementById("capturePhoto");

const retakePhoto =
document.getElementById("retakePhoto");

const usePhoto =
document.getElementById("usePhoto");

const closeCamera =
document.getElementById("closeCamera");

let cameraStream = null;
let pendingType = null;
let capturedPhoto = "";


/* ==============================
   DEVICE ID
============================== */

/*
  Ek device par ek permanent browser ID banega.
  Same browser me ye ID save rahegi.
*/

function getDeviceId(){

  let deviceId =
    localStorage.getItem("messho_device_id");

  if(!deviceId){

    deviceId =
      "DEV-" +
      crypto.randomUUID();

    localStorage.setItem(
      "messho_device_id",
      deviceId
    );
  }

  return deviceId;
}

const DEVICE_ID = getDeviceId();


/* ==============================
   MESSAGE
============================== */

function message(text){
  msg.textContent = text;
}


/* ==============================
   INDIA DATE TIME
============================== */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        weekday:"long",
        hour12:false
      }
    ).formatToParts(new Date());

  const get =
    type =>
      parts.find(
        p => p.type === type
      )?.value;

  return {
    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")
  };
}


/* ==============================
   DISTANCE
============================== */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const rad =
    v => v * Math.PI / 180;

  const dLat =
    rad(lat2-lat1);

  const dLon =
    rad(lon2-lon1);

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}


/* ==============================
   GPS
============================== */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "GPS browser me available nahi hai."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          const distance =
            distanceInMeters(
              lat,
              lng,
              OFFICE_LAT,
              OFFICE_LNG
            );

          if(
            distance >
            OFFICE_RADIUS_METERS
          ){

            reject(
              new Error(
                "Attendance blocked ❌\n\n" +
                "Aap office area ke bahar ho.\n" +
                "Distance: " +
                Math.round(distance) +
                " meters"
              )
            );

            return;
          }

          resolve({

            latitude:lat,
            longitude:lng,
            accuracy:accuracy,
            distance:Math.round(distance)

          });

        },

        error => {

          if(error.code === 1){

            reject(
              new Error(
                "GPS permission Allow karo."
              )
            );

          }else{

            reject(
              new Error(
                "Phone ka Location ON karo."
              )
            );

          }

        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }
      );
    }
  );
}


/* ==============================
   VERIFY EMPLOYEE
============================== */

async function verifyEmployee(){

  const id =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();

  if(!id || !pin){

    message(
      "Employee ID aur PIN bharo."
    );

    return null;
  }

  const {
    data:emp,
    error
  } = await db
    .from("employees")
    .select(
      "id,employee_id,name,pin,week_off,active,device_id"
    )
    .eq("employee_id",id)
    .eq("pin",pin)
    .eq("active",true)
    .maybeSingle();

  if(error){

    console.error(error);

    message(
      "Database error: " +
      error.message
    );

    return null;
  }

  if(!emp){

    message(
      "Employee ID/PIN incorrect."
    );

    return null;
  }


  /* ==============================
     DEVICE CHECK
  ============================== */

  if(
    emp.device_id &&
    emp.device_id !== DEVICE_ID
  ){

    message(
      "Attendance blocked ❌\n\n" +
      "Ye Employee ID kisi doosre mobile/device se already registered hai."
    );

    return null;
  }


  /* First device registration */

  if(!emp.device_id){

    const {
      error:updateError
    } = await db
      .from("employees")
      .update({
        device_id:DEVICE_ID
      })
      .eq("id",emp.id);

    if(updateError){

      console.error(updateError);

      message(
        "Device registration failed: " +
        updateError.message
      );

      return null;
    }

    emp.device_id = DEVICE_ID;
  }

  return emp;
}


/* ==============================
   CAMERA OPEN
============================== */

async function openCamera(type){

  pendingType = type;
  capturedPhoto = "";

  cameraModal.style.display = "block";

  cameraVideo.style.display = "block";
  photoPreview.style.display = "none";

  capturePhoto.style.display = "block";
  retakePhoto.style.display = "none";
  usePhoto.style.display = "none";

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user"
        },
        audio:false
      });

    cameraVideo.srcObject =
      cameraStream;

  }catch(error){

    console.error(error);

    cameraModal.style.display =
      "none";

    message(
      "Camera permission Allow karo."
    );
  }
}


/* ==============================
   STOP CAMERA
============================== */

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    cameraStream = null;
  }

  cameraVideo.srcObject = null;
}


/* ==============================
   CAPTURE
============================== */

capturePhoto.addEventListener(
  "click",
  () => {

    if(!cameraVideo.videoWidth){

      message(
        "Camera ready nahi hai. Thoda wait karo."
      );

      return;
    }

    const canvas =
      document.createElement("canvas");

    const maxWidth = 900;

    const scale =
      Math.min(
        1,
        maxWidth /
        cameraVideo.videoWidth
      );

    canvas.width =
      Math.round(
        cameraVideo.videoWidth *
        scale
      );

    canvas.height =
      Math.round(
        cameraVideo.videoHeight *
        scale
      );

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      cameraVideo,
      0,
      0,
      canvas.width,
      canvas.height
    );

    capturedPhoto =
      canvas.toDataURL(
        "image/jpeg",
        0.72
      );

    photoPreview.src =
      capturedPhoto;

    photoPreview.style.display =
      "block";

    cameraVideo.style.display =
      "none";

    capturePhoto.style.display =
      "none";

    retakePhoto.style.display =
      "block";

    usePhoto.style.display =
      "block";

    stopCamera();
  }
);


/* ==============================
   RETAKE
============================== */

retakePhoto.addEventListener(
  "click",
  () => {

    if(pendingType){

      openCamera(
        pendingType
      );
    }
  }
);


/* ==============================
   CANCEL
============================== */

closeCamera.addEventListener(
  "click",
  () => {

    stopCamera();

    cameraModal.style.display =
      "none";

    pendingType = null;
    capturedPhoto = "";
  }
);


/* ==============================
   USE PHOTO
============================== */

usePhoto.addEventListener(
  "click",
  async () => {

    const type =
      pendingType;

    if(!capturedPhoto){

      message(
        "Pehle photo lo."
      );

      return;
    }

    stopCamera();

    cameraModal.style.display =
      "none";

    pendingType = null;

    await mark(
      type,
      capturedPhoto
    );
  }
);


/* ==============================
   MARK ATTENDANCE
============================== */

async function mark(
  type,
  photo
){

  checkInButton.disabled = true;
  checkOutButton.disabled = true;
  myAttendanceButton.disabled = true;

  try{

    message(
      "Employee verify ho raha hai..."
    );

    const emp =
      await verifyEmployee();

    if(!emp) return;


    const now =
      getIndiaDateTime();


    if(
      COMPANY_HOLIDAYS.includes(
        now.date
      )
    ){

      message(
        "Aaj company holiday hai."
      );

      return;
    }


    message(
      "GPS location verify ho rahi hai..."
    );

    const gps =
      await getGPS();


    /* ==============================
       CHECK IN
    ============================== */

    if(type === "in"){

      const {
        data:existing,
        error:findError
      } = await db
        .from("attendance")
        .select("id,check_in,check_out")
        .eq("employee_id",emp.id)
        .eq("attendance_date",now.date)
        .maybeSingle();

      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }

      if(existing){

        message(
          "Aaj ka attendance already laga hua hai."
        );

        return;
      }


      const hour =
        Number(
          now.time.substring(0,2)
        );

      const minute =
        Number(
          now.time.substring(3,5)
        );

      const status =
        (
          hour > 9 ||
          (
            hour === 9 &&
            minute > 30
          )
        )
        ? "Late"
        : "Present";


      const {
        error
      } = await db
        .from("attendance")
        .insert({

          employee_id:emp.id,

          attendance_date:
            now.date,

          check_in:
            now.time,

          status:status,

          check_in_lat:
            gps.latitude,

          check_in_lng:
            gps.longitude,

          check_in_accuracy:
            gps.accuracy,

          check_in_photo:
            photo

        });


      if(error){

        console.error(error);

        message(
          "Check-In error: " +
          error.message
        );

        return;
      }


      message(
        "Check-In successful ✅\n\n" +
        "Employee: " +
        emp.name +
        "\n" +
        "Time: " +
        now.time +
        "\n" +
        "Distance: " +
        gps.distance +
        " meters"
      );

    }


    /* ==============================
       CHECK OUT
    ============================== */

    else{

      const {
        data:attendance,
        error:findError
      } = await db
        .from("attendance")
        .select("*")
        .eq("employee_id",emp.id)
        .eq("attendance_date",now.date)
        .maybeSingle();


      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }


      if(!attendance){

        message(
          "Aaj ka Check-In nahi mila."
        );

        return;
      }


      if(attendance.check_out){

        message(
          "Check-Out already ho chuka hai."
        );

        return;
      }


      const {
        error
      } = await db
        .from("attendance")
        .update({

          check_out:
            now.time,

          check_out_lat:
            gps.latitude,

          check_out_lng:
            gps.longitude,

          check_out_accuracy:
            gps.accuracy,

          check_out_photo:
            photo

        })
        .eq(
          "id",
          attendance.id
        );


      if(error){

        message(
          "Check-Out error: " +
          error.message
        );

        return;
      }


      message(
        "Check-Out successful ✅\n\n" +
        "Employee: " +
        emp.name +
        "\n" +
        "Time: " +
        now.time +
        "\n" +
        "Distance: " +
        gps.distance +
        " meters"
      );
    }

  }catch(error){

    console.error(error);

    message(
      error.message ||
      "Something went wrong."
    );

  }finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;
    myAttendanceButton.disabled = false;
  }
}


/* ==============================
   CHECK IN BUTTON
============================== */

checkInButton.addEventListener(
  "click",
  async () => {

    const emp =
      await verifyEmployee();

    if(emp){

      openCamera("in");

    }
  }
);


/* ==============================
   CHECK OUT BUTTON
============================== */

checkOutButton.addEventListener(
  "click",
  async () => {

    const emp =
      await verifyEmployee();

    if(emp){

      openCamera("out");

    }
  }
);


/* ==============================
   MY ATTENDANCE
============================== */

myAttendanceButton.addEventListener(
  "click",
  async () => {

    const id =
      document
        .getElementById("employeeId")
        .value
        .trim()
        .toUpperCase();

    const pin =
      document
        .getElementById("pin")
        .value
        .trim();

    if(!id || !pin){

      message(
        "Employee ID aur PIN bharo."
      );

      return;
    }

    const reportCard =
      document.getElementById(
        "reportCard"
      );

    const reportMsg =
      document.getElementById(
        "reportMsg"
      );

    const records =
      document.getElementById(
        "records"
      );

    reportCard.style.display =
      "block";

    reportMsg.textContent =
      "Attendance load ho rahi hai...";

    records.innerHTML = "";

    try{

      const {
        data:emp,
        error:empError
      } = await db
        .from("employees")
        .select(
          "id,employee_id,name,pin,active"
        )
        .eq("employee_id",id)
        .eq("pin",pin)
        .eq("active",true)
        .maybeSingle();

      if(empError)
        throw empError;

      if(!emp){

        reportMsg.textContent =
          "Employee ID/PIN incorrect.";

        return;
      }


      const {
        data:list,
        error
      } = await db
        .from("attendance")
        .select("*")
        .eq(
          "employee_id",
          emp.id
        )
        .order(
          "attendance_date",
          {ascending:false}
        )
        .limit(50);


      if(error)
        throw error;


      reportMsg.textContent =
        emp.name +
        " - " +
        emp.employee_id +
        "\n" +
        list.length +
        " record(s) found.";


      if(!list.length){

        records.innerHTML =
          "<div class='record'>" +
          "No attendance records found." +
          "</div>";

        return;
      }


      list.forEach(row => {

        const div =
          document.createElement("div");

        div.className =
          "record";

        div.innerHTML =

          "<strong>" +
          row.attendance_date +
          "</strong>" +

          "<div>Status: " +
          (row.status || "-") +
          "</div>" +

          "<div>Check In: " +
          (row.check_in || "-") +
          "</div>" +

          "<div>Check Out: " +
          (row.check_out || "-") +
          "</div>";

        if(row.check_in_photo){

          div.innerHTML +=
            "<div>Check-In Photo:</div>" +
            "<img class='photo' src='" +
            row.check_in_photo +
            "'>";
        }

        if(row.check_out_photo){

          div.innerHTML +=
            "<div>Check-Out Photo:</div>" +
            "<img class='photo' src='" +
            row.check_out_photo +
            "'>";
        }

        records.appendChild(div);
      });

    }catch(error){

      console.error(error);

      reportMsg.textContent =
        "Error: " +
        error.message;
    }
  }
);

</script>

</body>
</html>
