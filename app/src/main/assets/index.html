<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messho SC Attendance</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#172033;color:#fff;padding:20px}header h1{margin:0 0 6px}main{max-width:650px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0001;margin-bottom:18px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:bold}button:disabled{opacity:.6}.out{background:#d92d20}.secondary{background:#172033}#msg,#reportMsg{margin-top:12px;padding:12px;background:#eef4ff;border-radius:10px;white-space:pre-line}#reportCard{display:none}.employeeName{font-weight:bold;font-size:18px;margin-bottom:12px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}th{background:#f5f7fb}#cameraModal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;padding:15px}.cameraBox{max-width:600px;margin:20px auto;background:#fff;border-radius:16px;padding:15px}#cameraVideo,#photoPreview{width:100%;display:block;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}#photoPreview{display:none;margin-top:10px}.cameraButtons{display:flex;gap:8px}.cameraButtons button{margin:8px 0 0}.cancelBtn{background:#172033}.small{color:#666;font-size:13px;margin-top:8px}</style></head><body><header><h1>Messho SC</h1><div>Staff Attendance â€¢ Shift 09:30 AMâ€“06:00 PM</div></header><main><div class="card"><h2>Attendance</h2><input id="employeeId" placeholder="Employee ID (e.g. EMP001)" autocomplete="off"><input id="pin" type="password" placeholder="PIN" autocomplete="off"><button id="checkIn">ðŸŸ¢ Check In</button><button id="checkOut" class="out">ðŸ”´ Check Out</button><button id="myAttendance" class="secondary">ðŸ“‹ My Attendance</button><div id="msg">Enter Employee ID and PIN.</div></div><div class="card" id="reportCard"><h2>ðŸ“‹ My Attendance</h2><div id="employeeName" class="employeeName"></div><div id="reportMsg">Loading...</div><table><thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead><tbody id="reportBody"></tbody></table></div></main><div id="cameraModal"><div class="cameraBox"><h3 id="cameraTitle">ðŸ“¸ Take Selfie</h3><video id="cameraVideo" autoplay playsinline></video><canvas id="cameraCanvas" style="display:none"></canvas><img id="photoPreview" alt="Selfie preview"><div class="cameraButtons"><button id="capturePhoto">ðŸ“¸ Capture</button><button id="retakePhoto" style="display:none">ðŸ”„ Retake</button><button id="usePhoto" style="display:none">âœ… Use Photo</button><button id="cancelCamera" class="cancelBtn">Cancel</button></div><div class="small">Camera permission Allow karein.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://iijuflktxqqtgjbdywwj.supabase.co";const SUPABASE_KEY="sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const OFFICE_LAT=19.307765,OFFICE_LNG=73.071277,OFFICE_RADIUS_METERS=150;const COMPANY_HOLIDAYS=[];
const msg=document.getElementById("msg"),checkInButton=document.getElementById("checkIn"),checkOutButton=document.getElementById("checkOut"),reportCard=document.getElementById("reportCard"),employeeName=document.getElementById("employeeName"),reportMsg=document.getElementById("reportMsg"),reportBody=document.getElementById("reportBody");
const cameraModal=document.getElementById("cameraModal"),cameraVideo=document.getElementById("cameraVideo"),cameraCanvas=document.getElementById("cameraCanvas"),photoPreview=document.getElementById("photoPreview"),cameraTitle=document.getElementById("cameraTitle"),capturePhoto=document.getElementById("capturePhoto"),retakePhoto=document.getElementById("retakePhoto"),usePhoto=document.getElementById("usePhoto"),cancelCamera=document.getElementById("cancelCamera");let stream=null,capturedPhoto="",pendingType=null;
function message(t){msg.textContent=t}function getIndiaDateTime(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"long"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t)?.value;return{date:`${g("year")}-${g("month")}-${g("day")}`,time:`${g("hour")}:${g("minute")}`,weekday:g("weekday")}}function distanceInMeters(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,A=r(c-a),B=r(d-b),x=Math.sin(A/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(B/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function getGPS(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error("Is device par GPS available nahi hai."));navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude,accuracy=p.coords.accuracy,distance=distanceInMeters(lat,lng,OFFICE_LAT,OFFICE_LNG);if(distance>OFFICE_RADIUS_METERS)return reject(new Error("Attendance blocked âŒ\nAap office area se bahar ho.\nDistance: "+Math.round(distance)+" meters"));resolve({latitude:lat,longitude:lng,accuracy,distance:Math.round(distance)})},e=>reject(new Error(e.code===1?"GPS permission Allow karo.":e.code===2?"Phone ka Location ON karo.":e.code===3?"GPS timeout. Dobara try karo.":"GPS location nahi mil rahi.")),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function isHoliday(d){return COMPANY_HOLIDAYS.includes(d)}function isWeeklyOff(e,w){return e.week_off&&String(e.week_off).trim().toLowerCase()===w.toLowerCase()}
async function verifyEmployee(){const id=document.getElementById("employeeId").value.trim().toUpperCase(),pin=document.getElementById("pin").value.trim();if(!id||!pin){message("Employee ID aur PIN bharo.");return null}const {data:emp,error}=await db.from("employees").select("id,employee_id,name,pin,week_off,active").eq("employee_id",id).eq("pin",pin).eq("active",true).maybeSingle();if(error){message("Database error: "+error.message);return null}if(!emp){message("Employee ID/PIN incorrect.");return null}return emp}
async function openCamera(type){pendingType=type;capturedPhoto="";cameraTitle.textContent=type==="in"?"ðŸ“¸ Check-In Selfie":"ðŸ“¸ Check-Out Selfie";photoPreview.style.display="none";cameraVideo.style.display="block";capturePhoto.style.display="block";retakePhoto.style.display="none";usePhoto.style.display="none";cameraModal.style.display="block";try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:720},height:{ideal:720}},audio:false});cameraVideo.srcObject=stream}catch(e){closeCamera();message("Camera open nahi ho raha. Camera permission Allow karo.")}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}cameraVideo.srcObject=null}function closeCamera(){stopCamera();cameraModal.style.display="none";capturedPhoto="";pendingType=null}
capturePhoto.onclick=()=>{if(!cameraVideo.videoWidth)return message("Camera ready nahi hai. Thoda wait karo.");cameraCanvas.width=cameraVideo.videoWidth;cameraCanvas.height=cameraVideo.videoHeight;cameraCanvas.getContext("2d").drawImage(cameraVideo,0,0,cameraCanvas.width,cameraCanvas.height);capturedPhoto=cameraCanvas.toDataURL("image/jpeg",.65);photoPreview.src=capturedPhoto;photoPreview.style.display="block";cameraVideo.style.display="none";capturePhoto.style.display="none";retakePhoto.style.display="block";usePhoto.style.display="block";stopCamera()};
retakePhoto.onclick=()=>openCamera(pendingType);usePhoto.onclick=()=>{if(!capturedPhoto)return;const t=pendingType;const p=capturedPhoto;closeCamera();mark(t,p)};cancelCamera.onclick=closeCamera;
async function mark(type,photo){checkInButton.disabled=true;checkOutButton.disabled=true;try{message("Employee verify ho raha hai...");const emp=await verifyEmployee();if(!emp)return;const now=getIndiaDateTime();if(isHoliday(now.date))return message("Aaj company holiday hai. ðŸ›‘");if(isWeeklyOff(emp,now.weekday))return message("Aaj aapka weekly off hai. ðŸ›‘");message("GPS location verify ho rahi hai...");const gps=await getGPS();if(type==="in"){const {data:existing,error:findError}=await db.from("attendance").select("id,check_in,check_out").eq("employee_id",emp.id).eq("attendance_date",now.date).maybeSingle();if(findError)return message("Attendance check error: "+findError.message);if(existing)return message("Aaj ka attendance already laga hua hai. âš ï¸");const h=+now.time.slice(0,2),m=+now.time.slice(3,5),status=h>9||h===9&&m>30?"Late":"Present";const {error}=await db.from("attendance").insert({employee_id:emp.id,attendance_date:now.date,check_in:now.time,status,check_in_lat:gps.latitude,check_in_lng:gps.longitude,check_in_accuracy:gps.accuracy,check_in_photo:photo});if(error)return message("Check-In error: "+error.message);message("Check-In successful âœ…\nSelfie saved ðŸ“¸\nDistance from office: "+gps.distance+" meters")}else{const {data:a,error:e}=await db.from("attendance").select("*").eq("employee_id",emp.id).eq("attendance_date",now.date).maybeSingle();if(e)return message("Attendance check error: "+e.message);if(!a)return message("Aaj ka Check-In nahi mila.");if(a.check_out)return message("Check-Out already ho chuka hai.");const {error}=await db.from("attendance").update({check_out:now.time,check_out_lat:gps.latitude,check_out_lng:gps.longitude,check_out_accuracy:gps.accuracy,check_out_photo:photo}).eq("id",a.id);if(error)return message("Check-Out error: "+error.message);message("Check-Out successful âœ…\nSelfie saved ðŸ“¸\nDistance from office: "+gps.distance+" meters")}}catch(e){message(e.message||"Something went wrong.")}finally{checkInButton.disabled=false;checkOutButton.disabled=false}}
async function showMyAttendance(){reportCard.style.display="block";reportMsg.textContent="Employee verify ho raha hai...";reportBody.innerHTML="";const emp=await verifyEmployee();if(!emp){reportMsg.textContent="Employee verify nahi hua.";return}employeeName.textContent=emp.name+" ("+emp.employee_id+")";reportMsg.textContent="Attendance load ho rahi hai...";const {data,error}=await db.from("attendance_report").select("attendance_date,check_in,check_out,status").eq("employee_id",emp.employee_id).order("attendance_date",{ascending:false});if(error)return reportMsg.textContent="Report error: "+error.message;if(!data?.length)return reportMsg.textContent="Abhi attendance record nahi mila.";reportMsg.textContent=data.length+" attendance record found.";data.forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${r.attendance_date||"-"}</td><td>${r.check_in||"-"}</td><td>${r.check_out||"-"}</td><td>${r.status||"-"}</td>`;reportBody.appendChild(tr)})}
checkInButton.onclick=()=>openCamera("in");checkOutButton.onclick=()=>openCamera("out");document.getElementById("myAttendance").onclick=showMyAttendance;window.addEventListener("beforeunload",stopCamera);
</script></body></html>
