/* =========================================
   INDIA DATE / TIME
========================================= */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",

        year:"numeric",
        month:"2-digit",
        day:"2-digit",

        hour:"2-digit",
        minute:"2-digit",

        hour12:false,

        weekday:"long"
      }
    ).formatToParts(new Date());


  const get =
    type =>
      parts.find(
        p => p.type === type
      )?.value;


  return {

    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")

  };

}


/* =========================================
   GPS DISTANCE
========================================= */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRadians =
    value =>
      value * Math.PI / 180;


  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);


  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(
      toRadians(lat1)
    ) *

    Math.cos(
      toRadians(lat2)
    ) *

    Math.sin(dLon / 2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
