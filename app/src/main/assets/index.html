<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://iijuflktxqqtgjbdywwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   OFFICE GPS
========================================= */

const OFFICE_LAT = 19.307765;
const OFFICE_LNG = 73.071277;

const OFFICE_RADIUS_METERS = 150;


/* =========================================
   HOLIDAYS
========================================= */

const COMPANY_HOLIDAYS = [
  // "2026-08-15"
];


/* =========================================
   ELEMENTS
========================================= */

const msg =
document.getElementById("msg");

const checkInButton =
document.getElementById("checkIn");

const checkOutButton =
document.getElementById("checkOut");

const myAttendanceButton =
document.getElementById("myAttendance");

const reportCard =
document.getElementById("reportCard");

const employeeName =
document.getElementById("employeeName");

const reportMsg =
document.getElementById("reportMsg");

const reportBody =
document.querySelector("#reportTable tbody");


function message(text){
  msg.textContent = text;
}


/* =========================================
   DEVICE ID
========================================= */

function getDeviceId(){

  try{

    if(
      window.AndroidDevice &&
      typeof window.AndroidDevice.getDeviceId === "function"
    ){

      return window.AndroidDevice.getDeviceId();

    }

  }catch(error){

    console.error("Device ID error:",error);

  }

  return "";
}


/* =========================================
   INDIA DATE/TIME
========================================= */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Kolkata",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false,
        weekday:"long"
      }
    ).formatToParts(new Date());

  const get = type =>
    parts.find(
      p => p.type === type
    )?.value;

  return {

    date:
      `${get("year")}-${get("month")}-${get("day")}`,

    time:
      `${get("hour")}:${get("minute")}`,

    weekday:
      get("weekday")

  };
}


/* =========================================
   DISTANCE
========================================= */

function distanceInMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRadians =
    value => value * Math.PI / 180;

  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(toRadians(lat1)) *
    Math.cos(toRadians(lat2)) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =========================================
   GPS
========================================= */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Is device par GPS available nahi hai."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          const distance =
            distanceInMeters(
              lat,
              lng,
              OFFICE_LAT,
              OFFICE_LNG
            );

          if(
            distance >
            OFFICE_RADIUS_METERS
          ){

            reject(
              new Error(
                "Attendance blocked ❌\n" +
                "Aap office area se bahar ho.\n" +
                "Distance: " +
                Math.round(distance) +
                " meters"
              )
            );

            return;
          }

          resolve({

            latitude:lat,
            longitude:lng,
            accuracy:accuracy,
            distance:Math.round(distance)

          });

        },

        error => {

          if(error.code === 1){

            reject(
              new Error(
                "GPS permission Allow karo."
              )
            );

          }else if(error.code === 2){

            reject(
              new Error(
                "Phone ka Location ON karo."
              )
            );

          }else if(error.code === 3){

            reject(
              new Error(
                "GPS timeout. Dobara try karo."
              )
            );

          }else{

            reject(
              new Error(
                "GPS location nahi mil rahi."
              )
            );

          }

        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }

      );

    }
  );
}


/* =========================================
   HOLIDAY / WEEK OFF
========================================= */

function isHoliday(date){

  return COMPANY_HOLIDAYS.includes(date);

}


function isWeeklyOff(employee,weekday){

  if(!employee.week_off)
    return false;

  return String(employee.week_off)
    .trim()
    .toLowerCase() ===
    weekday.toLowerCase();

}


/* =========================================
   EMPLOYEE LOGIN
========================================= */

async function verifyEmployee(){

  const id =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();

  if(!id || !pin){

    message(
      "Employee ID aur PIN bharo."
    );

    return null;
  }


  const {
    data:emp,
    error
  } = await db
    .from("employees")
    .select(
      "id,employee_id,name,pin,week_off,active,device_id"
    )
    .eq("employee_id",id)
    .eq("pin",pin)
    .eq("active",true)
    .maybeSingle();


  if(error){

    console.error(error);

    message(
      "Database error: " +
      error.message
    );

    return null;
  }


  if(!emp){

    message(
      "Employee ID/PIN incorrect."
    );

    return null;
  }


  /* =====================================
     DEVICE BINDING
  ===================================== */

  const currentDevice =
    getDeviceId();


  if(!currentDevice){

    message(
      "Device ID nahi mil raha.\n" +
      "APK se attendance use karo."
    );

    return null;
  }


  /*
   * First successful device becomes
   * the employee's registered device.
   */

  if(!emp.device_id){

    const {
      error:bindError
    } = await db
      .from("employees")
      .update({
        device_id:currentDevice
      })
      .eq("id",emp.id);


    if(bindError){

      console.error(bindError);

      message(
        "Device binding error: " +
        bindError.message
      );

      return null;
    }

  }else if(
    emp.device_id !== currentDevice
  ){

    message(
      "Attendance blocked ❌\n\n" +
      "Ye Employee ID kisi doosre phone " +
      "se already linked hai.\n\n" +
      "Apne registered phone se hi attendance lagao."
    );

    return null;
  }


  return emp;
}


/* =========================================
   MARK ATTENDANCE
========================================= */

async function mark(type){

  checkInButton.disabled = true;
  checkOutButton.disabled = true;

  try{

    message(
      "Employee verify ho raha hai..."
    );


    const emp =
      await verifyEmployee();


    if(!emp)
      return;


    const now =
      getIndiaDateTime();


    if(isHoliday(now.date)){

      message(
        "Aaj company holiday hai. 🛑"
      );

      return;
    }


    if(
      isWeeklyOff(
        emp,
        now.weekday
      )
    ){

      message(
        "Aaj aapka weekly off hai. 🛑"
      );

      return;
    }


    message(
      "GPS location verify ho rahi hai..."
    );


    const gps =
      await getGPS();


    /* =====================================
       CHECK IN
    ===================================== */

    if(type === "in"){

      const {
        data:existing,
        error:findError
      } = await db
        .from("attendance")
        .select(
          "id,check_in,check_out"
        )
        .eq(
          "employee_id",
          emp.id
        )
        .eq(
          "attendance_date",
          now.date
        )
        .maybeSingle();


      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }


      if(existing){

        message(
          "Aaj ka attendance already laga hua hai. ⚠️"
        );

        return;
      }


      const hour =
        Number(
          now.time.slice(0,2)
        );

      const minute =
        Number(
          now.time.slice(3,5)
        );


      const late =
        hour > 9 ||
        (
          hour === 9 &&
          minute > 30
        );


      const status =
        late ? "Late" : "Present";


      const {
        error
      } = await db
        .from("attendance")
        .insert({

          employee_id:emp.id,

          attendance_date:
            now.date,

          check_in:
            now.time,

          status:status,

          check_in_lat:
            gps.latitude,

          check_in_lng:
            gps.longitude,

          check_in_accuracy:
            gps.accuracy

        });


      if(error){

        console.error(error);

        if(
          error.message &&
          error.message.includes(
            "attendance_employee_id_attendance_date_key"
          )
        ){

          message(
            "Aaj ka attendance already laga hua hai. ⚠️"
          );

        }else{

          message(
            "Check-In error: " +
            error.message
          );

        }

        return;
      }


      message(
        "Check-In successful ✅\n" +
        "Distance from office: " +
        gps.distance +
        " meters"
      );

    }


    /* =====================================
       CHECK OUT
    ===================================== */

    else{

      const {
        data:attendance,
        error:findError
      } = await db
        .from("attendance")
        .select("*")
        .eq(
          "employee_id",
          emp.id
        )
        .eq(
          "attendance_date",
          now.date
        )
        .maybeSingle();


      if(findError){

        message(
          "Attendance check error: " +
          findError.message
        );

        return;
      }


      if(!attendance){

        message(
          "Aaj ka Check-In nahi mila."
        );

        return;
      }


      if(attendance.check_out){

        message(
          "Check-Out already ho chuka hai."
        );

        return;
      }


      const {
        error
      } = await db
        .from("attendance")
        .update({

          check_out:
            now.time,

          check_out_lat:
            gps.latitude,

          check_out_lng:
            gps.longitude,

          check_out_accuracy:
            gps.accuracy

        })
        .eq(
          "id",
          attendance.id
        );


      if(error){

        message(
          "Check-Out error: " +
          error.message
        );

        return;
      }


      message(
        "Check-Out successful ✅\n" +
        "Distance from office: " +
        gps.distance +
        " meters"
      );

    }

  }catch(error){

    console.error(error);

    message(
      error.message ||
      "Something went wrong."
    );

  }finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;

  }

}


/* =========================================
   MY ATTENDANCE
========================================= */

async function showMyAttendance(){

  reportCard.style.display =
    "block";

  reportMsg.textContent =
    "Employee verify ho raha hai...";

  reportBody.innerHTML = "";


  const emp =
    await verifyEmployee();


  if(!emp){

    reportMsg.textContent =
      "Employee verify nahi hua.";

    return;
  }


  employeeName.textContent =
    emp.name +
    " (" +
    emp.employee_id +
    ")";


  reportMsg.textContent =
    "Attendance load ho rahi hai...";


  const {
    data,
    error
  } = await db
    .from("attendance_report")
    .select(
      "attendance_date,check_in,check_out,status"
    )
    .eq(
      "employee_id",
      emp.employee_id
    )
    .order(
      "attendance_date",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    reportMsg.textContent =
      "Report error: " +
      error.message;

    return;
  }


  reportBody.innerHTML = "";


  if(!data || data.length === 0){

    reportMsg.textContent =
      "Abhi attendance record nahi mila.";

    return;
  }


  reportMsg.textContent =
    data.length +
    " attendance record found.";


  data.forEach(row => {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `
      <td>${row.attendance_date || "-"}</td>
      <td>${row.check_in || "-"}</td>
      <td>${row.check_out || "-"}</td>
      <td>${row.status || "-"}</td>
    `;


    reportBody.appendChild(tr);

  });

}


/* =========================================
   BUTTONS
========================================= */

checkInButton.addEventListener(
  "click",
  () => mark("in")
);


checkOutButton.addEventListener(
  "click",
  () => mark("out")
);


myAttendanceButton.addEventListener(
  "click",
  showMyAttendance
);

</script>
