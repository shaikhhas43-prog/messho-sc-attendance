<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://iijuflktxqqtgjbdywwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DPvuwTV2LgNOIeCR1XOGOQ_NyOMn0J0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   OFFICE GPS
============================== */

const OFFICE_LAT = 19.307765;
const OFFICE_LNG = 73.071277;
const OFFICE_RADIUS_METERS = 150;

/* Put company holiday dates here as YYYY-MM-DD */
const COMPANY_HOLIDAYS = [];


/* ==============================
   ELEMENTS
============================== */

const employeeIdInput = document.getElementById("employeeId");
const pinInput = document.getElementById("pin");

const msg = document.getElementById("msg");

const checkInButton = document.getElementById("checkIn");
const checkOutButton = document.getElementById("checkOut");
const myAttendanceButton = document.getElementById("myAttendance");

const cameraModal = document.getElementById("cameraModal");
const cameraTitle = document.getElementById("cameraTitle");
const cameraVideo = document.getElementById("cameraVideo");
const photoPreview = document.getElementById("photoPreview");

const capturePhoto = document.getElementById("capturePhoto");
const retakePhoto = document.getElementById("retakePhoto");
const usePhoto = document.getElementById("usePhoto");
const closeCamera = document.getElementById("closeCamera");

let cameraStream = null;
let pendingType = null;
let capturedPhoto = "";


/* ==============================
   DEVICE ID
============================== */

function getDeviceId(){
  let id = localStorage.getItem("messho_device_id");

  if(!id){
    if(window.crypto && crypto.randomUUID){
      id = "DEV-" + crypto.randomUUID();
    }else{
      id = "DEV-" +
        Date.now() + "-" +
        Math.random().toString(36).slice(2);
    }

    localStorage.setItem("messho_device_id", id);
  }

  return id;
}

const DEVICE_ID = getDeviceId();


/* ==============================
   HELPERS
============================== */

function message(text){
  msg.textContent = text;
}

function getCredentials(){
  const id = employeeIdInput.value.trim().toUpperCase();
  const pin = pinInput.value.trim();

  if(!id || !pin){
    message("Employee ID and PIN are required.");
    return null;
  }

  return {id,pin};
}


/* ==============================
   INDIA DATE/TIME
============================== */

function getIndiaDateTime(){

  const parts =
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Kolkata",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      weekday:"long",
      hour12:false
    }).formatToParts(new Date());

  const get = type =>
    parts.find(p => p.type === type)?.value;

  return {
    date:`${get("year")}-${get("month")}-${get("day")}`,
    time:`${get("hour")}:${get("minute")}`,
    weekday:get("weekday")
  };
}


/* ==============================
   WEEK OFF
============================== */

function isWeeklyOff(employee,weekday){

  if(!employee.week_off) return false;

  return String(employee.week_off)
    .trim()
    .toLowerCase() ===
    String(weekday)
      .trim()
      .toLowerCase();
}


/* ==============================
   DISTANCE
============================== */

function distanceInMeters(
  lat1,lon1,lat2,lon2
){

  const R = 6371000;

  const rad = v => v * Math.PI / 180;

  const dLat = rad(lat2-lat1);
  const dLon = rad(lon2-lon1);

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon/2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}


/* ==============================
   GPS
============================== */

function getGPS(){

  return new Promise((resolve,reject)=>{

    if(!navigator.geolocation){
      reject(new Error(
        "GPS is not available in this browser."
      ));
      return;
    }

    navigator.geolocation.getCurrentPosition(

      position => {

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        const distance =
          distanceInMeters(
            lat,lng,
            OFFICE_LAT,OFFICE_LNG
          );

        if(distance > OFFICE_RADIUS_METERS){

          reject(new Error(
            "Attendance blocked.\n" +
            "You are outside the office area.\n" +
            "Distance: " +
            Math.round(distance) +
            " meters."
          ));

          return;
        }

        resolve({
          latitude:lat,
          longitude:lng,
          accuracy:accuracy,
          distance:Math.round(distance)
        });

      },

      error => {

        if(error.code === 1){
          reject(new Error(
            "Location permission is denied. Allow Location and try again."
          ));
        }else if(error.code === 2){
          reject(new Error(
            "Phone Location is OFF. Turn it ON and try again."
          ));
        }else if(error.code === 3){
          reject(new Error(
            "GPS timeout. Turn Location ON and try again."
          ));
        }else{
          reject(new Error(
            "GPS location could not be obtained."
          ));
        }

      },

      {
        enableHighAccuracy:true,
        timeout:20000,
        maximumAge:0
      }
    );
  });
}


/* ==============================
   VERIFY EMPLOYEE + DEVICE
============================== */

async function verifyEmployee(){

  const credentials = getCredentials();

  if(!credentials) return null;

  const {id,pin} = credentials;

  try{

    const {
      data:claim,
      error:claimError
    } = await db.rpc(
      "claim_employee_device",
      {
        p_employee_id:id,
        p_pin:pin,
        p_device_id:DEVICE_ID
      }
    );

    if(claimError){
      console.error(claimError);

      message(
        "Device verification error:\n" +
        claimError.message
      );

      return null;
    }

    const result =
      Array.isArray(claim)
        ? claim[0]
        : claim;

    if(!result || result.success !== true){

      message(
        "Attendance blocked.\n\n" +
        (
          result?.message ||
          "This device is already registered to another employee."
        )
      );

      return null;
    }


    const {
      data:emp,
      error:empError
    } = await db
      .from("employees")
      .select(
        "id,employee_id,name,pin,week_off,active,device_id"
      )
      .eq("employee_id",id)
      .eq("active",true)
      .maybeSingle();

    if(empError){
      message(
        "Employee database error:\n" +
        empError.message
      );
      return null;
    }

    if(!emp){
      message("Employee not found.");
      return null;
    }

    return emp;

  }catch(error){

    console.error(error);

    message(
      error.message ||
      "Employee verification failed."
    );

    return null;
  }
}


/* ==============================
   CAMERA
============================== */

async function openCamera(type){

  pendingType = type;
  capturedPhoto = "";

  cameraTitle.textContent =
    type === "in"
      ? "Check In Photo"
      : "Check Out Photo";

  cameraModal.style.display = "block";

  cameraVideo.style.display = "block";
  photoPreview.style.display = "none";

  capturePhoto.style.display = "block";
  retakePhoto.style.display = "none";
  usePhoto.style.display = "none";

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      throw new Error(
        "Camera is not supported by this browser."
      );
    }

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

    cameraVideo.srcObject = cameraStream;

    await cameraVideo.play().catch(()=>{});

  }catch(error){

    console.error(error);

    stopCamera();

    cameraModal.style.display = "none";

    message(
      "Camera permission is required. " +
      "Allow camera access and try again."
    );
  }
}


/* ==============================
   STOP CAMERA
============================== */

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track => track.stop());

    cameraStream = null;
  }

  cameraVideo.srcObject = null;
}


/* ==============================
   CAPTURE PHOTO
============================== */

capturePhoto.addEventListener("click",()=>{

  if(!cameraVideo.videoWidth ||
     !cameraVideo.videoHeight){

    message(
      "Camera is not ready. Wait a moment and try again."
    );

    return;
  }

  const canvas =
    document.createElement("canvas");

  const maxWidth = 900;

  const scale =
    Math.min(
      1,
      maxWidth / cameraVideo.videoWidth
    );

  canvas.width =
    Math.round(
      cameraVideo.videoWidth * scale
    );

  canvas.height =
    Math.round(
      cameraVideo.videoHeight * scale
    );

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    cameraVideo,
    0,0,
    canvas.width,
    canvas.height
  );

  capturedPhoto =
    canvas.toDataURL(
      "image/jpeg",
      0.72
    );

  photoPreview.src = capturedPhoto;

  photoPreview.style.display = "block";
  cameraVideo.style.display = "none";

  capturePhoto.style.display = "none";
  retakePhoto.style.display = "block";
  usePhoto.style.display = "block";

  stopCamera();
});


/* ==============================
   RETAKE
============================== */

retakePhoto.addEventListener("click",()=>{

  if(pendingType){
    openCamera(pendingType);
  }
});


/* ==============================
   CANCEL
============================== */

closeCamera.addEventListener("click",()=>{

  stopCamera();

  cameraModal.style.display = "none";

  pendingType = null;
  capturedPhoto = "";
});


/* ==============================
   USE PHOTO
============================== */

usePhoto.addEventListener("click",async()=>{

  if(!capturedPhoto){
    message("Take a photo first.");
    return;
  }

  const type = pendingType;
  const photo = capturedPhoto;

  stopCamera();

  cameraModal.style.display = "none";

  pendingType = null;
  capturedPhoto = "";

  await mark(type,photo);
});


/* ==============================
   MARK ATTENDANCE
============================== */

async function mark(type,photo){

  checkInButton.disabled = true;
  checkOutButton.disabled = true;
  myAttendanceButton.disabled = true;

  try{

    message("Employee verification...");

    const emp = await verifyEmployee();

    if(!emp) return;


    const now = getIndiaDateTime();


    if(COMPANY_HOLIDAYS.includes(now.date)){

      message("Today is a company holiday.");
      return;
    }


    if(isWeeklyOff(emp,now.weekday)){

      message(
        "Today is your weekly off.\n" +
        "Attendance cannot be marked."
      );

      return;
    }


    message("Checking GPS location...");

    const gps = await getGPS();


    /* ==========================
       CHECK IN
    ========================== */

    if(type === "in"){

      const {
        data:existing,
        error:findError
      } = await db
        .from("attendance")
        .select("id,check_in,check_out")
        .eq("employee_id",emp.id)
        .eq("attendance_date",now.date)
        .maybeSingle();

      if(findError){
        message(
          "Attendance check error:\n" +
          findError.message
        );
        return;
      }

      if(existing){
        message(
          "Today's attendance is already marked."
        );
        return;
      }


      const hour =
        Number(now.time.substring(0,2));

      const minute =
        Number(now.time.substring(3,5));

      const status =
        (
          hour > 9 ||
          (hour === 9 && minute > 30)
        )
        ? "Late"
        : "Present";


      const {error} =
        await db
          .from("attendance")
          .insert({
            employee_id:emp.id,
            attendance_date:now.date,
            check_in:now.time,
            status:status,
            check_in_lat:gps.latitude,
            check_in_lng:gps.longitude,
            check_in_accuracy:gps.accuracy,
            check_in_photo:photo
          });


      if(error){

        console.error(error);

        if(String(error.message).includes(
          "attendance_employee_id_attendance_date_key"
        )){
          message(
            "Today's attendance is already marked."
          );
        }else{
          message(
            "Check-In error:\n" +
            error.message
          );
        }

        return;
      }


      message(
        "Check-In successful.\n\n" +
        "Employee: " + emp.name +
        "\nTime: " + now.time +
        "\nStatus: " + status +
        "\nDistance: " + gps.distance + " meters"
      );

    }


    /* ==========================
       CHECK OUT
    ========================== */

    else{

      const {
        data:attendance,
        error:findError
      } = await db
        .from("attendance")
        .select("*")
        .eq("employee_id",emp.id)
        .eq("attendance_date",now.date)
        .maybeSingle();


      if(findError){
        message(
          "Attendance check error:\n" +
          findError.message
        );
        return;
      }


      if(!attendance){
        message(
          "Today's Check-In was not found."
        );
        return;
      }


      if(attendance.check_out){
        message(
          "Check-Out is already completed."
        );
        return;
      }


      const {error} =
        await db
          .from("attendance")
          .update({
            check_out:now.time,
            check_out_lat:gps.latitude,
            check_out_lng:gps.longitude,
            check_out_accuracy:gps.accuracy,
            check_out_photo:photo
          })
          .eq("id",attendance.id);


      if(error){
        message(
          "Check-Out error:\n" +
          error.message
        );
        return;
      }


      message(
        "Check-Out successful.\n\n" +
        "Employee: " + emp.name +
        "\nTime: " + now.time +
        "\nDistance: " + gps.distance + " meters"
      );
    }

  }catch(error){

    console.error(error);

    message(
      error.message ||
      "Something went wrong."
    );

  }finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;
    myAttendanceButton.disabled = false;
  }
}


/* ==============================
   CHECK IN BUTTON
============================== */

checkInButton.addEventListener("click",async()=>{

  checkInButton.disabled = true;
  checkOutButton.disabled = true;
  myAttendanceButton.disabled = true;

  try{

    message("Employee verification...");

    const emp = await verifyEmployee();

    if(emp){
      await openCamera("in");
    }

  }finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;
    myAttendanceButton.disabled = false;
  }
});


/* ==============================
   CHECK OUT BUTTON
============================== */

checkOutButton.addEventListener("click",async()=>{

  checkInButton.disabled = true;
  checkOutButton.disabled = true;
  myAttendanceButton.disabled = true;

  try{

    message("Employee verification...");

    const emp = await verifyEmployee();

    if(emp){
      await openCamera("out");
    }

  }finally{

    checkInButton.disabled = false;
    checkOutButton.disabled = false;
    myAttendanceButton.disabled = false;
  }
});


/* ==============================
   MY ATTENDANCE
============================== */

myAttendanceButton.addEventListener("click",async()=>{

  const credentials = getCredentials();

  if(!credentials) return;

  const {id,pin} = credentials;

  const reportCard =
    document.getElementById("reportCard");

  const reportMsg =
    document.getElementById("reportMsg");

  const records =
    document.getElementById("records");

  reportCard.style.display = "block";

  reportMsg.textContent =
    "Attendance is loading...";

  records.innerHTML = "";

  try{

    const {
      data:emp,
      error:empError
    } = await db
      .from("employees")
      .select("id,employee_id,name,pin")
      .eq("employee_id",id)
      .eq("pin",pin)
      .eq("active",true)
      .maybeSingle();

    if(empError) throw empError;

    if(!emp){

      reportMsg.textContent =
        "Employee ID or PIN is incorrect.";

      return;
    }


    const {
      data:list,
      error
    } = await db
      .from("attendance")
      .select(
        "attendance_date,check_in,check_out,status,check_in_photo,check_out_photo"
      )
      .eq("employee_id",emp.id)
      .order(
        "attendance_date",
        {ascending:false}
      )
      .limit(50);

    if(error) throw error;


    reportMsg.textContent =
      emp.name +
      " - " +
      emp.employee_id +
      "\n" +
      list.length +
      " record(s) found.";


    if(!list.length){

      records.innerHTML =
        "<div class='record'>" +
        "No attendance records found." +
        "</div>";

      return;
    }


    list.forEach(row=>{

      const div =
        document.createElement("div");

      div.className = "record";

      let html =
        "<strong>" +
        escapeHtml(row.attendance_date || "-") +
        "</strong>" +

        "<div>Status: " +
        escapeHtml(row.status || "-") +
        "</div>" +

        "<div>Check In: " +
        escapeHtml(row.check_in || "-") +
        "</div>" +

        "<div>Check Out: " +
        escapeHtml(row.check_out || "-") +
        "</div>";


      if(row.check_in_photo){

        html +=
          "<div>Check-In Photo:</div>" +
          "<img class='photo' src='" +
          safePhoto(row.check_in_photo) +
          "' alt='Check-In Photo'>";
      }


      if(row.check_out_photo){

        html +=
          "<div style='margin-top:8px'>Check-Out Photo:</div>" +
          "<img class='photo' src='" +
          safePhoto(row.check_out_photo) +
          "' alt='Check-Out Photo'>";
      }


      div.innerHTML = html;

      records.appendChild(div);
    });

  }catch(error){

    console.error(error);

    reportMsg.textContent =
      "Could not load attendance:\n" +
      error.message;
  }
});


/* ==============================
   HTML ESCAPE
============================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==============================
   PHOTO SAFETY
============================== */

function safePhoto(value){

  const text = String(value || "");

  if(text.startsWith("data:image/")){
    return text;
  }

  return "";
}


/* ==============================
   PAGE CLEANUP
============================== */

window.addEventListener("pagehide",()=>{
  stopCamera();
});

window.addEventListener("beforeunload",()=>{
  stopCamera();
});
</script>
